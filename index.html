<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Convoyages">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Convoyages & Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: outil mobile d'abord — en-tête collant avec onglets comptés, filtres, liste de fiches, bouton d'ajout flottant, formulaire en volet. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e3e9ee; --ink:#13202b; --muted:#5a6b79; --line:#d3dce4;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde7dc;
  --ok:#2f7d3b; --ok-soft:#e1f2e3; --bad:#b42323; --bad-soft:#fbe3e3; --warn:#9a5a00; --warn-soft:#fdf0d9;
  --ba:#1d5fa8; --bb1:#0f7a72; --bb2:#6a3fb5; --bmap:#9a5a00;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --surface:#152029; --sunk:#1b2833; --ink:#e4ebf1; --muted:#90a1af; --line:#26343f;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#62c675; --ok-soft:#173222; --bad:#ff7070; --bad-soft:#3a1b1b; --warn:#f2a94a; --warn-soft:#382a14;
  --ba:#6aa8f0; --bb1:#45c4b8; --bb2:#a988ef; --bmap:#f2a94a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#152029; --sunk:#1b2833; --ink:#e4ebf1; --muted:#90a1af; --line:#26343f;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#62c675; --ok-soft:#173222; --bad:#ff7070; --bad-soft:#3a1b1b; --warn:#f2a94a; --warn-soft:#382a14;
  --ba:#6aa8f0; --bb1:#45c4b8; --bb2:#a988ef; --bmap:#f2a94a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 0;display:grid;gap:12px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;min-width:0;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 6px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.72rem;background:var(--sunk);border-radius:20px;padding:1px 7px;color:var(--ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:14px 110px;display:grid;gap:12px}
.note{font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 12px;font:500 .85rem var(--f-body);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--muted)}
.card.past{opacity:.72}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top .status{margin-left:auto}
.dest{font-family:var(--f-display);font-weight:600;font-size:1.35rem;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.when{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.when b{color:var(--ink);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:2px 7px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:500}
.status{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.status.live{border-color:var(--ok);color:var(--ok)}
.status.soon{border-color:var(--accent);color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:.72rem;font-weight:500;border-radius:4px;padding:1px 6px;border:1.5px solid currentColor}
.badge[data-b="Tech A"]{color:var(--ba)}.badge[data-b="Tech B1"]{color:var(--bb1)}.badge[data-b="Tech B2"]{color:var(--bb2)}.badge[data-b="MAP"]{color:var(--bmap)}
.crew{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.85rem}
.crew span{display:inline-flex;gap:6px;align-items:center}
.crew b{font-weight:700}
.crew .none{color:var(--muted);font-style:italic}
.warns{display:grid;gap:2px;font-size:.82rem;color:var(--bad)}
.warns div::before{content:"⚠ "}
.tech-name{font-weight:600;font-size:1.05rem}
.notes{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:10px;justify-items:start}
.empty h2{margin:0;font-family:var(--f-display);font-size:1.3rem}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:600 .9rem var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:16px}}
.panel h2{margin:0 0 14px;font-family:var(--f-display);font-size:1.5rem}
form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--bg)}
.seg input:checked+label{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.picker{display:grid;gap:6px}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick .nm{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.pick .fl{font-size:.75rem;color:var(--muted);white-space:nowrap}
.pick .fl .no{color:var(--bad);font-weight:600}
.dur{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);margin:-6px 0 0}
.err{color:var(--bad);font-size:.85rem;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.actions .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
.foot{display:flex;justify-content:flex-end}
/* arrière-plans au choix */
:root{--on-bg-muted:var(--muted)}
:root[data-bg="white"]{--bg:#ffffff}
:root[data-bg="red"]{--bg:#c62828;--on-bg-muted:rgba(255,255,255,.88)}
@media (prefers-color-scheme: dark){:root[data-bg="white"]:not([data-theme="light"]){--bg:#080c10}:root[data-bg="red"]:not([data-theme="light"]){--bg:#4a0d10;--on-bg-muted:rgba(255,220,220,.85)}}
:root[data-bg="white"][data-theme="dark"]{--bg:#080c10}
:root[data-bg="red"][data-theme="dark"]{--bg:#4a0d10;--on-bg-muted:rgba(255,220,220,.85)}
.btn.link{color:var(--on-bg-muted)}
.hrow{display:flex;align-items:flex-start;gap:12px}
.hrow h1{flex:1;min-width:0}
.gear{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer}
.settings{display:grid;gap:16px;margin-bottom:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 .9rem var(--f-body);cursor:pointer}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}
.sw-grey{background:#eef2f5}.sw-white{background:#ffffff}.sw-red{background:#c62828}
.quota{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrow input{width:64px;text-align:center;font:600 1.1rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.qcount{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.qinfo{margin:0;font-size:.82rem;font-weight:600;color:var(--ok)}
.qinfo.full{color:var(--bad)}
.pick.locked{opacity:.45;cursor:not-allowed}
.tab{flex:1 0 auto}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.caltitle{margin:0;font-family:var(--f-display);font-size:1.35rem;flex:1;min-width:0;text-align:center}
html[lang="ar"] .caltitle{font-family:"IBM Plex Sans Arabic",var(--f-display)}
.calview{flex:1 1 auto}
.vbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--on-bg-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.wdn{font-size:.7rem;text-align:center;color:var(--muted);text-transform:capitalize;padding-bottom:2px}
.wn{font-family:var(--f-mono);font-size:.65rem;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;align-self:center}
.wn.h{color:var(--muted);cursor:default}
.day{min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit}
.day.out{opacity:.4}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:50%}
.day.sel{outline:2px solid var(--ink);outline-offset:-1px}
.dn{font:600 .85rem var(--f-mono);width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;font:600 .62rem var(--f-mono);font-style:normal;color:#fff;padding:0 3px}
.legend .dot{min-width:12px;height:12px}
.dot.c{background:var(--accent)}.dot.m{background:var(--ba)}
.daypanel,.wkview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.dphead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.dphead h3{margin:0;font-size:1.05rem}
.dpbtns{display:flex;gap:6px}
.rlist{display:grid;gap:6px}
.ritem{display:grid;gap:2px;text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit}
.ritem.m{border-inline-start-color:var(--ba)}
.rtag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.who{font-size:.85rem;color:var(--muted)}
.wday{display:grid;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.wday:last-child{border-bottom:0}
.wdh{text-align:start;background:none;border:0;padding:0;font:600 .95rem var(--f-body);color:var(--ink);cursor:pointer}
.wday.today .wdh{color:var(--accent)}
.wday.sel .wdh{text-decoration:underline}
.ntext{white-space:pre-wrap;font-size:.9rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
textarea.big{min-height:180px}.cal{display:block;padding:6px}
.wrow{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));column-gap:3px;row-gap:3px;padding-block:3px}
.wrow.head{padding-bottom:0}
.cal .day{grid-row-end:auto;min-height:62px;align-items:flex-start;justify-content:flex-start;padding:3px;border-radius:6px}
.wrow>.dn,.wrow .wn{align-self:start;padding-top:6px}
.bar{position:relative;z-index:1;align-self:center;height:20px;margin:0 2px;border:0;border-radius:6px;color:#fff;font:600 .68rem var(--f-body);padding:0 6px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.bar.m{background:var(--ba)}.bar.c{background:var(--accent);color:var(--accent-ink)}
.bar.cl{border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:-4px}
.bar.cr{border-start-end-radius:0;border-end-end-radius:0;margin-inline-end:-4px}
.wpad{height:2px}
.lbar{display:inline-block;width:22px;height:8px;border-radius:4px}
.lbar.c{background:var(--accent)}.lbar.m{background:var(--ba)}
.dchips{margin:-6px 0 12px}
.dgrid{display:grid;gap:8px;margin-bottom:14px}
.drow{display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.dtechs{display:grid;gap:6px}
.dtech{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;text-align:start;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;cursor:pointer}
.panel .warns{margin-bottom:12px}

.bkrow{display:flex;gap:8px;flex-wrap:wrap}
.bkrow label.btn{display:inline-flex;align-items:center}
.syncinfo{color:var(--ok)}
.bkconfirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px}
.bkconfirm p{margin:0 0 6px}

/* arabe : droite à gauche */
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic",var(--f-body)}
html[lang="ar"] h1,html[lang="ar"] .dest,html[lang="ar"] .panel h2,html[lang="ar"] .empty h2{font-family:"IBM Plex Sans Arabic",var(--f-display);letter-spacing:0}
html[lang="ar"] .lbl,html[lang="ar"] .status,html[lang="ar"] h1 small{letter-spacing:0;text-transform:none}
html[dir="rtl"] .fab{right:auto;left:calc(16px + env(safe-area-inset-left,0px))}
html[dir="rtl"] .weekbar .share{margin-left:0;margin-right:auto}
html[dir="rtl"] .top .status{margin-left:0;margin-right:auto}
html[dir="rtl"] .hint{padding-left:0;padding-right:28px}

.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.wsel{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:700;font-size:1.5rem}
.wsel select{font:inherit;color:var(--accent);background:transparent;border:0;padding:0 2px;cursor:pointer}
.wsel span{font-family:var(--f-mono);font-size:.75rem;font-weight:400;color:var(--muted)}
.wrange{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:1;min-width:0}
.weekbar .share{margin-left:auto}
.rotation{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.rotation summary{cursor:pointer;font-weight:600}
.rotation ul{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:6px}
.rotation li{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.9rem}
.rotation .rot{color:var(--muted);flex-basis:100%}
.rotation strong{color:var(--ok)}
.hint{flex-basis:100%;font-size:.75rem;color:var(--muted);padding-left:28px}
.hint:empty{display:none}
.hint.sugg{color:var(--ok);font-weight:600}
.hint.busy{color:var(--bad);font-weight:600}
.pick{flex-wrap:wrap}
.preview{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:40vh;overflow:auto;margin:0 0 12px}
.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- semaines ISO ---------- */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
function weekStart(y,w){const j4=new Date(Date.UTC(y,0,4));const day=j4.getUTCDay()||7;const m=new Date(j4);m.setUTCDate(j4.getUTCDate()-day+1+(w-1)*7);return m}
const weeksIn=y=>isoWeek(new Date(y,11,28)).w;
const iso=d=>d.toISOString().slice(0,10);
function plus(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x}
let ui={tab:"convoyages",filter:{missions:"all",convoyages:"all",techs:"all"},week:isoWeekNow(),cal:(()=>{const t=todayStr();return{y:+t.slice(0,4),m:+t.slice(5,7)-1,sel:t,view:"month"}})()};
function occIn(c,ws){if(!c.date)return null;const wss=iso(ws),wes=iso(plus(ws,6));
 if(!c.repeat)return(c.date>=wss&&c.date<=wes)?c.date:null;
 const wd=(new Date(c.date+"T00:00:00Z").getUTCDay()+6)%7;const os=iso(plus(ws,wd));
 if(os<c.date||(c.until&&os>c.until))return null;return os}
function itemsOfWeek(y,w){const ws=weekStart(y,w);return state.convoyages.map(c=>({c,d:occIn(c,ws)})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d))}
const weekItems=()=>itemsOfWeek(ui.week.y,ui.week.w);
function weekRange(){const ws=weekStart(ui.week.y,ui.week.w);return[iso(ws),iso(plus(ws,6))]}
function missionWeek(){const[a,b]=weekRange();return state.missions.filter(m=>m.debut&&m.debut<=b&&(m.fin||m.debut)>=a)}
const wkey=(y,w)=>`${y}-W${w}`;
const quotaOf=(y,w)=>+(state.quota[wkey(y,w)]||0);
function crewOfWeek(y,w,excl){const s=new Set();itemsOfWeek(y,w).forEach(({c})=>{if(c.id!==excl)(c.techs||[]).forEach(id=>{if(techById(id))s.add(id)})});return s}

/* occupation : le technicien est-il déjà pris ce jour-là ? */
function busyOn(tid,d,excl){
 for(const m of state.missions){if(m.id!==excl&&(m.techs||[]).includes(tid)&&m.debut&&m.debut<=d&&(m.fin||m.debut)>=d)return T("busy_m")+" "+(m.destination||"");}
 for(const c of state.convoyages){if(c.id===excl||!(c.techs||[]).includes(tid)||!c.date)continue;
  if(!c.repeat){if(c.date===d)return T("busy_c")+" "+(c.destination||V(c.zone))}
  else if(d>=c.date&&(!c.until||d<=c.until)&&((Date.parse(d)-Date.parse(c.date))/864e5)%7===0)return T("busy_c")+" "+(c.destination||V(c.zone))}
 return null}
function busyRange(tid,a,b,excl){if(!a)return null;b=b||a;let d=new Date(a+"T00:00:00Z");for(let i=0;i<62&&iso(d)<=b;i++,d=plus(d,1)){const r=busyOn(tid,iso(d),excl);if(r)return r}return null}
function conflicts(ids,a,b,excl){const w=[];(ids||[]).forEach(id=>{const t=techById(id);if(!t)return;const r=busyRange(id,a,b,excl);if(r)w.push(T("warn_busy",t.nom,r.trim()))});return w}

function lastNature(tid,y,w){let py=y,pw=w-1;if(pw<1){py--;pw=weeksIn(py)}const ws=weekStart(py,pw);let n=null;

 return`<details class="rotation"><summary>${T("rot_title",w)}</summary><ul>${rows}</ul><p class="notes">${T("rot_note")}</p></details>`}

function mStatus(m){const t=todayStr();if(!m.debut)return[T("st_plan"),""];const fin=m.fin||m.debut;if(t<m.debut)return[T("st_soon"),"soon"];if(t>fin)return[T("st_done_f"),"past"];return[T("st_live_f"),"live"]}

 convoyages:[["all","f_all",()=>true],["Simple","f_simple",c=>c.nature==="Simple"],["Double","f_double",c=>c.nature==="Double"],["Afrique","v_Afrique",c=>c.zone==="Afrique"],["Europe","v_Europe",c=>c.zone==="Europe"],["rep","f_rep",c=>c.repeat],["sp","f_sp",c=>c.spontane]],
 techs:[["all","f_all",()=>true],...BADGES.map(b=>[b,null,t=>t.badge===b]),["novisa","f_novisa",t=>!t.visa],["novac","f_novac",t=>!t.vaccin]]}[k]}

/* ---------- calendrier ---------- */
function occOn(c,d){if(!c.date)return false;if(!c.repeat)return c.date===d;return d>=c.date&&(!c.until||d<=c.until)&&Math.round((Date.parse(d)-Date.parse(c.date))/864e5)%7===0}
function itemsOn(d){return{cs:state.convoyages.filter(c=>occOn(c,d)),ms:state.missions.filter(m=>m.debut&&m.debut<=d&&(m.fin||m.debut)>=d)}}
const names=ids=>(ids||[]).map(techById).filter(Boolean).map(t=>t.nom).join(", ")||T("toAssign");
function rowC(c,d){return`<button class="ritem c" data-detail="convoyages:${c.id}:${d||""}"><span class="rtag">${V(c.nature)} · ${V(c.zone)}</span><b>${esc(c.destination||V(c.zone))}</b><span class="who">${esc(names(c.techs))}</span></button>`}
function rowM(m){return`<button class="ritem m" data-detail="missions:${m.id}:"><span class="rtag">${V(m.type)}</span><b>${esc(m.destination)}</b><span class="who">${esc(names(m.techs))}</span></button>`}
function calHead(label){const rtl=LANG==="ar";const c=ui.cal;
 return`<div class="calbar"><button class="wbtn" data-calnav="-1" aria-label="${T("cal_prev")}">${rtl?"›":"‹"}</button><h2 class="caltitle">${label}</h2><button class="wbtn" data-calnav="1" aria-label="${T("cal_next")}">${rtl?"‹":"›"}</button>
 <div class="seg calview"><button type="button" class="vbtn" data-calview="month" aria-pressed="${c.view==="month"}">${T("cal_month")}</button><button type="button" class="vbtn" data-calview="week" aria-pressed="${c.view==="week"}">${T("cal_week")}</button></div>
 <button class="btn" data-caltoday="1">${T("cal_today")}</button></div>
 <div class="legend"><span><i class="lbar c"></i>${T("lg_c")}</span><span><i class="lbar m"></i>${T("lg_m")}</span></div>`}
function dayPanel(d){const{cs,ms}=itemsOn(d);
 return`<div class="daypanel"><div class="dphead"><h3>${dayName(d)} · S${weekOf(d).w}</h3><div class="dpbtns"><button class="btn primary" data-addc="1">${T("add_c")}</button><button class="btn" data-addm="1">${T("add_m")}</button></div></div>
 ${cs.length||ms.length?`<div class="rlist">${cs.map(c=>rowC(c,d)).join("")}${ms.map(rowM).join("")}</div>`:`<p class="notes">${T("cal_none")}</p>`}</div>`}
function calendarView(){const c=ui.cal;const t0=todayStr();
 if(c.view==="week"){const wk=weekOf(c.sel);const ws=weekStart(wk.y,wk.w);const a=iso(ws),b=iso(plus(ws,6));
  let h=calHead(`S${wk.w} · ${fmtShort(a)} – ${fmt(b)}`)+'<div class="wkview">';
  for(let i=0;i<7;i++){const d=iso(plus(ws,i));const{cs,ms}=itemsOn(d);
   h+=`<div class="wday ${d===t0?"today":""} ${d===c.sel?"sel":""}"><button class="wdh" data-day="${d}">${dayName(d)}</button>${cs.length||ms.length?`<div class="rlist">${cs.map(c=>rowC(c,d)).join("")}${ms.map(rowM).join("")}</div>`:""}</div>`}
  return h+"</div>"+dayPanel(c.sel)}
 const first=new Date(Date.UTC(c.y,c.m,1));const last=new Date(Date.UTC(c.y,c.m+1,0));let d=plus(first,-((first.getUTCDay()+6)%7));
 const label=first.toLocaleDateString(LOC[LANG],{month:"long",year:"numeric",timeZone:"UTC"});
 const wd=Array.from({length:7},(_,i)=>new Date(Date.UTC(2024,0,1+i)).toLocaleDateString(LOC[LANG],{weekday:"short",timeZone:"UTC"}));
 let h=calHead(label.charAt(0).toUpperCase()+label.slice(1))+`<div class="cal"><div class="wrow head"><span class="wn h">S</span>${wd.map(x=>`<span class="wdn">${x}</span>`).join("")}</div>`;
 const diff=(x,y)=>Math.round((Date.parse(x)-Date.parse(y))/864e5);
 while(d<=last){const a=iso(d),b=iso(plus(d,6));const wk=isoWeek(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  let row=`<div class="wrow"><button class="wn" data-calweek="${a}" style="grid-column:1;grid-row:1">S${wk.w}</button>`;
  const segs=[];
  state.missions.filter(m=>m.debut&&m.debut<=b&&(m.fin||m.debut)>=a).forEach(m=>{const st=Math.max(0,diff(m.debut,a)),en=Math.min(6,diff(m.fin||m.debut,a));segs.push({k:"m",id:m.id,st,en,cl:m.debut<a,cr:(m.fin||m.debut)>b,lab:m.destination||V(m.type),dd:""})});
  for(let i=0;i<7;i++){const ds=iso(plus(d,i));state.convoyages.filter(x=>occOn(x,ds)).forEach(x=>segs.push({k:"c",id:x.id,st:i,en:i,lab:(x.nature==="Double"?"D":"S")+" · "+(x.destination||V(x.zone)),dd:ds}))}
  segs.sort((p,q)=>p.st-q.st||(q.en-q.st)-(p.en-p.st));const lanes=[];
  segs.forEach(g=>{let l=lanes.findIndex(e=>e<g.st);if(l<0){l=lanes.length;lanes.push(-1)}lanes[l]=g.en;g.l=l});
  const span=lanes.length+3;
  for(let i=0;i<7;i++){const x=plus(d,i);const ds=iso(x);const out=x.getUTCMonth()!==c.m;
   row+=`<button class="day ${out?"out":""} ${ds===t0?"today":""} ${ds===c.sel?"sel":""}" data-day="${ds}" style="grid-column:${i+2};grid-row:1/${span}"><span class="dn">${x.getUTCDate()}</span></button>`}
  segs.forEach(g=>{const l=g.l;
   row+=`<button class="bar ${g.k} ${g.cl?"cl":""} ${g.cr?"cr":""}" style="grid-column:${g.st+2}/${g.en+3};grid-row:${l+2}" data-detail="${g.k==="m"?"missions":"convoyages"}:${g.id}:${g.dd}" title="${esc(g.lab)}">${esc(g.lab)}</button>`});
  row+=`<span class="wpad" style="grid-column:2/-1;grid-row:${lanes.length+2}"></span></div>`;h+=row;d=plus(d,7)}
 return h+"</div>"+dayPanel(c.sel)}

  const wa=weekOf(it.debut).w,wb=weekOf(it.fin||it.debut).w;

 else{const d=dd||it.date;const s=cStatus(it,d);title=esc(it.destination||V(it.zone));
  chips=`<span class="chip ${it.nature==="Double"?"acc":""}">${V(it.nature)}</span><span class="chip">${V(it.zone)}</span>${it.spontane?`<span class="chip">${T("spont")}</span>`:""}<span class="status ${s[1]}">${s[0]}</span>`;

  w=isPast(s)?[]:[...warns(it,it.zone),...conflicts(it.techs,d,d,it.id)]}
 const ts=(it.techs||[]).map(techById).filter(Boolean);
 const techs=ts.length?`<div class="dtechs">${ts.map(t=>`<button class="dtech" data-edit="techs:${t.id}"><b>${esc(t.nom)}</b><span class="badge" data-b="${esc(t.badge)}">${esc(t.badge)}</span><span class="chip ${t.vaccin?"ok":"bad"}">${T("vac")} ${t.vaccin?"✓":"✗"}</span><span class="chip ${t.visa?"ok":"bad"}">${T("visa_s")} ${t.visa?"✓":"✗"}</span></button>`).join("")}</div><p class="notes">${T("d_tap")}</p>`:`<p class="notes">${T("noTech")}</p>`;
 $("#panel").innerHTML=`<h2>${title}</h2><div class="top dchips">${chips}</div><div class="dgrid">${body}</div>
 <div class="field"><span class="lbl">${T("d_techs")} (${ts.length})</span>${techs}</div>${warnBlock(w)}${it.notes?`<div class="field"><span class="lbl">${T("f_notes")}</span><div class="ntext">${esc(it.notes)}</div></div>`:""}
 <div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">${T("close")}</button><button type="button" class="btn primary" data-edit="${kind}:${it.id}">${T("d_edit")}</button></div>`;
 $("#sheet").hidden=false}

function render(){
 $("#h1t").textContent=T("title");
 const upM=missionWeek().length, upC=weekItems().length;
 $("#tabs").innerHTML=[["convoyages",upC],["missions",upM],["techs",state.techs.length],["cal",""],["notes",state.notes.length]].map(([k,n])=>`<button class="tab" role="tab" aria-selected="${ui.tab===k}" data-tab="${k}">${T("tab_"+k)}${n!==""?`<span class="n">${n}</span>`:""}</button>`).join("");
 setSync();
 $("#fab").hidden=mode==="pending"||ui.tab==="cal";
 $("#fab").textContent=T("fab_"+ui.tab);
 const k=ui.tab;let html="";
 if(note)html+=`<div class="note">${esc(T(note))}</div>`;
 if(mode==="pending"){html+=`<div class="empty"><h2>${T("loading_h")}</h2><p>${T("loading_p")}</p></div>`;$("#main").innerHTML=html;return}
 if(k==="cal"){html+=calendarView();$("#main").innerHTML=html;return}
 if(k==="notes"){html+=state.notes.length?'<div class="list">'+[...state.notes].sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).map(noteCard).join("")+"</div>":emptyState("notes");$("#main").innerHTML=html;return}
 const all=state[k];
 if(!all.length){html+=emptyState(k)}
 else{
  if(k!=="techs")html+=weekBar();

  html+='<div class="filters">'+F.map(([id,lk])=>`<button class="fchip" aria-pressed="${ui.filter[k]===id}" data-filter="${esc(id)}">${lk?T(lk):esc(id)}</button>`).join("")+"</div>";

  if(k==="missions")list=sortByDate(list,"debut");else if(k==="techs")list=[...list].sort((a,b)=>BADGES.indexOf(a.badge)-BADGES.indexOf(b.badge)||a.nom.localeCompare(b.nom));
  const emptyMsg=k==="convoyages"?T("noweek_c",ui.week.w):k==="missions"?T("noweek_m",ui.week.w):T("nofilter");
  html+='<div class="list">'+(list.length?list.map(k==="missions"?missionCard:k==="convoyages"?convCard:techCard).join(""):`<div class="empty"><p>${emptyMsg}</p></div>`)+"</div>";
  if([...state.missions,...state.convoyages,...state.techs].some(x=>x.exemple))html+=`<div class="foot"><button class="btn link" id="clearEx">${T("clearEx")}</button></div>`;
 }
 $("#main").innerHTML=html;

function quotaCheck(d,sel){if(!d)return null;const wk=weekOf(d);const q=quotaOf(wk.y,wk.w);if(!q)return null;const crewSet=crewOfWeek(wk.y,wk.w,editing.id);sel.forEach(id=>crewSet.add(id));return{q,w:wk.w,crewSet,full:crewSet.size>=q,over:crewSet.size>q}}
function liveForm(){const f=$("#f");if(!f)return;const fd=new FormData(f);
 if(editing.kind==="missions"){const d=nbDays(fd.get("debut"),fd.get("fin"));$("#dur").textContent=d>0?T("dur",d):T("dur_err");
  const a=fd.get("debut"),b=fd.get("fin");
  f.querySelectorAll(".hint").forEach(h=>{const r=a&&b&&b>=a?busyRange(h.dataset.tid,a,b,editing.id):null;h.className="hint"+(r?" busy":"");h.textContent=r?T("h_busy_range"):""})}
 if(editing.kind==="convoyages"){const d=fd.get("date"),n=fd.get("nature");const sel=fd.getAll("techs");
  $("#untilBox").hidden=!fd.has("repeat");
  const w=[...warns({techs:sel},fd.get("zone")),...(d?conflicts(sel,d,d,editing.id):[])];$("#fwarn").innerHTML=w.map(x=>`<div>${esc(x)}</div>`).join("");
  const qc=quotaCheck(d,sel);const qi=$("#qinfo");
  f.querySelectorAll('input[name="techs"]').forEach(cb=>{const lock=qc&&qc.full&&!cb.checked&&!qc.crewSet.has(cb.value);cb.disabled=!!lock;cb.closest(".pick").classList.toggle("locked",!!lock)});
  if(qc){qi.hidden=false;qi.className="qinfo"+(qc.full?" full":"");qi.textContent=qc.full?T("q_limit",qc.q,qc.w):T("q_count",qc.crewSet.size,qc.q)+" · S"+qc.w}else qi.hidden=true;
  const wk=d?weekOf(d):null;
  f.querySelectorAll(".hint").forEach(h=>{const tid=h.dataset.tid;const b=d?busyOn(tid,d,editing.id):null;
   if(b){h.className="hint busy";h.textContent=T("h_busy_day");return}
   const l=wk?lastNature(tid,wk.y,wk.w):null;const ok=!l||opposite(l)===n;
   h.className="hint"+(ok?" sugg":"");h.textContent=(l?T("h_last",V(l)):T("h_free"))+(ok?T("h_sugg"):"")})}}

function submitForm(e){e.preventDefault();const f=e.target,fd=new FormData(f),err=$("#ferr");const k=editing.kind;let o;
 const fail=m=>{err.textContent=m;err.hidden=false};
 if(k==="missions"){o={type:fd.get("type"),spontanee:fd.has("spontanee"),destination:fd.get("destination").trim(),debut:fd.get("debut"),fin:fd.get("fin"),techs:fd.getAll("techs"),notes:fd.get("notes").trim()};
  if(!o.destination)return fail(T("e_dest"));if(!o.debut||!o.fin)return fail(T("e_dates"));if(o.fin<o.debut)return fail(T("e_order"))}
 else if(k==="convoyages"){o={date:fd.get("date"),nature:fd.get("nature"),zone:fd.get("zone"),destination:fd.get("destination").trim(),spontane:fd.has("spontane"),repeat:fd.has("repeat"),until:fd.has("repeat")?(fd.get("until")||""):"",techs:fd.getAll("techs"),notes:fd.get("notes").trim()};
  if(!o.date)return fail(T("e_cdate"));if(o.until&&o.until<o.date)return fail(T("e_until"));
  const qc=quotaCheck(o.date,o.techs);if(qc&&qc.over)return fail(T("e_quota",qc.q,qc.w))}
 else if(k==="notes"){o={titre:fd.get("titre").trim(),texte:fd.get("texte").trim(),updated:todayStr()};if(!o.titre&&!o.texte)return fail(T("e_note"))}
 else{o={nom:fd.get("nom").trim(),badge:fd.get("badge"),vaccin:fd.get("vaccin")==="Oui",visa:fd.get("visa")==="Oui",notes:fd.get("notes").trim()};if(!o.nom)return fail(T("e_name"))}
 if(editing.id){const i=state[k].findIndex(x=>x.id===editing.id);const prev=state[k][i];state[k][i]={...prev,...o,id:prev.id,exemple:false}}
 else state[k].push({...o,id:uid()});
 const wasNew=!editing.id;closeForm();render();persist();toast(T(wasNew?"t_added":"t_edited"));
}
function deleteItem(btn){if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent=T("confirmDel");return}
 const{kind,id}=editing;state[kind]=state[kind].filter(x=>x.id!==id);
 if(kind==="techs"){[...state.missions,...state.convoyages].forEach(x=>x.techs=(x.techs||[]).filter(t=>t!==id))}
 closeForm();render();persist();toast(T("t_deleted"))}

/* ---------- partage hebdomadaire ---------- */
function shareData(kind,l){const t=(k,...a)=>TL(l,k,...a),v=x=>t("v_"+x);const{y,w}=ui.week;const[a,b]=weekRange();const range=t("sh_range",fmtL(l,a),fmtL(l,b));const rows=[];let lines=[];
 if(kind==="convoyages"){const title=t("sh_title_c",w);let cur="";
  weekItems().forEach(({c,d})=>{const ts=(c.techs||[]).map(techById).filter(Boolean);const day=dayNameL(l,d);
   if(day!==cur){lines.push("",day);cur=day}
   (ts.length?ts:[{nom:t("toAssign")}]).forEach(x=>{lines.push(`- ${x.nom} : ${v(c.nature)} - ${v(c.zone)}`);rows.push([day,x.nom,v(c.nature),v(c.zone)])})});
  return{title,range,cols:t("sh_cols_c"),rows,text:[title,range,...lines].join("\n"),file:`${t("file_c")}-S${w}-${y}`,none:t("pdf_none")}}
 const title=t("sh_title_m",w);
 sortByDate(missionWeek(),"debut").forEach(m=>{const ts=(m.techs||[]).map(techById).filter(Boolean);const dates=`${fmtShortL(l,m.debut)} - ${fmtShortL(l,m.fin||m.debut)}`;
  lines.push("",`${m.destination} (${v(m.type)}${m.spontanee?t("sh_spont"):""}) : ${dates}`);
  (ts.length?ts:[{nom:t("toAssign")}]).forEach(x=>{lines.push(`- ${x.nom}`);rows.push([dates,x.nom,v(m.type),m.destination])})});
 return{title,range,cols:t("sh_cols_m"),rows,text:[title,range,...lines].join("\n"),file:`${t("file_m")}-S${w}-${y}`,none:t("pdf_none")}}
let shareCur=null;
function openShare(){const kind=ui.tab;const s=shareData(kind,LANG);shareCur={kind,...s};editing={kind:"share"};
 $("#panel").innerHTML=`<h2>${T("sh_head",ui.week.w)}</h2>
 ${s.rows.length?"":`<p class="notes">${T("sh_empty")}</p>`}
 <pre class="preview">${esc(s.text)}</pre>
 <div class="share-actions">
  <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(s.text)}" target="_blank" rel="noopener">${T("sh_wa")}</a>
  <button type="button" class="btn" id="copyTxt">${T("sh_copy")}</button>
  <button type="button" class="btn dlb" id="saveNote">${T("sh_note")}</button>
  <button type="button" class="btn dlb" id="savePdf">${T("sh_pdf")}</button>
 </div>
 <p class="notes">${T("sh_hint")} ${LANG==="ar"?T("sh_pdf_lang"):""}</p>
 <div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">${T("close")}</button></div>`;
 $("#sheet").hidden=false;
 getDl().then(dl=>{if(!dl)document.querySelectorAll(".dlb").forEach(b=>b.hidden=true)});
}
const MIME={pdf:"application/pdf",txt:"text/plain",json:"application/json"};
const localDl={async save({filename,data}){const ext=filename.split(".").pop();const blob=data instanceof Blob?data:new Blob([data],{type:(MIME[ext]||"application/octet-stream")+";charset=utf-8"});
 const file=new File([blob],filename,{type:MIME[ext]||blob.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
let dlP=null;function getDl(){if(!dlP)dlP=Promise.resolve(localDl);return dlP}
async function copyText(){const t=shareCur.text;try{await navigator.clipboard.writeText(t);toast(T("t_copied"))}catch(e){const p=document.querySelector(".preview");const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(T("t_selected"))}}
async function saveFile(kind){const dl=await getDl();if(!dl)return;let data,name;
 if(kind==="txt"){data=shareCur.text;name=shareCur.file+".txt"}
 else{if(!window.jspdf){toast(T("t_pdfNA"));return}const s=LANG==="ar"?shareData(shareCur.kind,"fr"):shareCur;data=buildPdf(s);name=s.file+".pdf"}
 try{await dl.save({filename:name,data});toast(T(kind==="txt"?"t_noteReady":"t_pdfReady"))}
 catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast(T("t_busyShare"));return}toast(T("t_shareFail"))}}
function buildPdf(s){const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const L=15,W=180;let y=20;
 const clean=t=>String(t).replace(/[–—]/g,"-").replace(/ | /g," ");
 doc.setFont("helvetica","bold");doc.setFontSize(15);doc.splitTextToSize(clean(s.title),W).forEach(l=>{doc.text(l,L,y);y+=7});
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text(clean(s.range),L,y);y+=9;doc.setTextColor(0);
 const cw=[42,58,30,50];const head=()=>{doc.setFillColor(230,235,240);doc.rect(L,y-5,W,7,"F");doc.setFont("helvetica","bold");let x=L+2;s.cols.forEach((c,i)=>{doc.text(c,x,y);x+=cw[i]});y+=7;doc.setFont("helvetica","normal")};
 head();
 if(!s.rows.length)doc.text(s.none,L+2,y);
 let prev="";s.rows.forEach(r=>{if(y>280){doc.addPage();y=20;head()}let x=L+2;
  r.forEach((v,i)=>{const t=(i===0&&v===prev)?"":clean(v);doc.text(doc.splitTextToSize(t,cw[i]-3)[0]||"",x,y);x+=cw[i]});prev=r[0];
  doc.setDrawColor(220);doc.line(L,y+2,L+W,y+2);y+=7});
 return doc.output("blob")}

/* ---------- exemples ---------- */
function loadExamples(){
 const t=[["Youssef El Amrani","Tech B1",true,true],["Sara Bennani","Tech B2",true,false],["Hamza Tazi","Tech A",false,true],["Nadia Alaoui","MAP",true,true]].map(([nom,badge,vaccin,visa])=>({id:uid(),nom,badge,vaccin,visa,notes:"",exemple:true}));
 state.techs=t;
 state.missions=[
  {id:uid(),type:"Externe",spontanee:false,destination:"Dakar – escale client",debut:addDays(4),fin:addDays(7),techs:[t[0].id,t[3].id],notes:"",exemple:true},
  {id:uid(),type:"Interne",spontanee:true,destination:"Casablanca – hangar 2",debut:addDays(0),fin:addDays(1),techs:[t[2].id],notes:"",exemple:true},
  {id:uid(),type:"Externe",spontanee:false,destination:"Abidjan",debut:addDays(-12),fin:addDays(-9),techs:[t[1].id],notes:"",exemple:true}];
 state.convoyages=[
  {id:uid(),date:addDays(9),nature:"Simple",zone:"Europe",destination:"Toulouse",spontane:false,techs:[t[0].id,t[1].id],notes:"",exemple:true},
  {id:uid(),date:addDays(14),nature:"Double",zone:"Afrique",destination:"Libreville",spontane:true,techs:[t[2].id,t[3].id],notes:"",exemple:true},
  {id:uid(),date:addDays(-6),nature:"Double",zone:"Afrique",destination:"Nouakchott",spontane:false,repeat:true,until:"",techs:[t[3].id],notes:"",exemple:true}];
 render();persist();toast(T("t_exLoaded"))}
function clearExamples(){for(const k of["missions","convoyages","techs"])state[k]=state[k].filter(x=>!x.exemple);const ids=new Set(state.techs.map(t=>t.id));[...state.missions,...state.convoyages].forEach(x=>x.techs=(x.techs||[]).filter(i=>ids.has(i)));render();persist();toast(T("t_exCleared"))}

/* ---------- stockage ---------- */
async function persist(){
 if(mode==="local"){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}return}
 if(mode!=="cloud")return;
 dirty=true;if(writing)return;writing=true;setSync();
 while(dirty){dirty=false;const body=JSON.parse(JSON.stringify(state));
  try{await ref.set(body)}catch(e){
   if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await ref.set(body)}catch(e2){toast(T("t_saveRetry"))}}
   else if(e&&e.code==="quota_exceeded")toast(T("t_quota"));
   else toast(T("t_saveFail"))}}
 writing=false;setSync()}
function setSync(){$("#sub").textContent=mode==="local"?T("subLocal"):mode==="cloud"?(writing||dirty?T("sync_saving"):T("sync_ok")):T("sub")}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function adoptPrefs(){if(state.prefs){prefs={...prefs,...state.prefs};try{localStorage.setItem(PKEY,JSON.stringify(prefs))}catch(e){}applyPrefs()}else if(prefs)state.prefs=prefs}

async function boot(){
 try{const p=JSON.parse(localStorage.getItem(PKEY)||"null");if(p)prefs={...prefs,...p}}catch(e){}
 applyPrefs();render();
 let db=null,id=null;
 try{if(false){db=await claude.use("db");const u=await claude.use("user");id=u?await u.id():null}}catch(e){}
 if(db&&id){
  ref=db.doc("data/users/"+id+"/app");
  const timer=setTimeout(()=>{if(mode==="pending"){mode="cloud";note="n_slow";render()}},10000);
  ref.onSnapshot(s=>{
   if(!s.metadata.fromCache){clearTimeout(timer);if(note==="n_slow")note=""}
   const first=mode==="pending";mode="cloud";
   if(!first&&(writing||dirty))return;
   state=normalize(s.exists?s.data():null);adoptPrefs();if(!$("#sheet").hidden&&editing)return;render()},
  e=>{clearTimeout(timer);mode="cloud";note="n_broken";render()});
 }else{
  mode="local";try{state=normalize(JSON.parse(localStorage.getItem(KEY)||"null"))}catch(e){state=normalize(null)}adoptPrefs();render()}
}

/* ---------- événements ---------- */
document.addEventListener("click",e=>{
 if(e.target.closest("#settingsBtn")){pendingImport=null;openSettings();return}
 if(e.target.closest("#bkExport")){exportBackup();return}
 if(e.target.closest("#bkReplace")){applyImport();return}
 if(e.target.closest("#bkCancel")){pendingImport=null;openSettings();return}
 const dt=e.target.closest("[data-detail]");if(dt){const[k,id,dd]=dt.dataset.detail.split(":");openDetail(k,id,dd);return}
 const dy=e.target.closest("[data-day]");if(dy){calSelect(dy.dataset.day);return}
 const cw=e.target.closest("[data-calweek]");if(cw){ui.cal.view="week";calSelect(cw.dataset.calweek);return}
 const cn=e.target.closest("[data-calnav]");if(cn){calNav(+cn.dataset.calnav);return}
 const cv=e.target.closest("[data-calview]");if(cv){ui.cal.view=cv.dataset.calview;render();return}
 if(e.target.closest("[data-caltoday]")){calSelect(todayStr());return}
 if(e.target.closest("[data-addc]")){openForm("convoyages",null,ui.cal.sel);return}
 if(e.target.closest("[data-addm]")){openForm("missions",null,ui.cal.sel);return}
 const sw=e.target.closest("[data-bgv]");if(sw){setPref("bg",sw.dataset.bgv);return}
 const tab=e.target.closest("[data-tab]");if(tab){ui.tab=tab.dataset.tab;render();return}
 const fl=e.target.closest("[data-filter]");if(fl){ui.filter[ui.tab]=fl.dataset.filter;render();return}
 const ed=e.target.closest("[data-edit]");if(ed){const[k,id]=ed.dataset.edit.split(":");openForm(k,id);return}
 if(e.target.closest("[data-new]")||e.target.closest("#fab")){openForm(ui.tab);return}
 const wk=e.target.closest("[data-wk]");if(wk){shiftWeek(+wk.dataset.wk);return}
 const qb=e.target.closest("[data-q]");if(qb){setQuota(quotaOf(ui.week.y,ui.week.w)+(+qb.dataset.q));return}
 if(e.target.closest("#shareBtn")){openShare();return}
 if(e.target.closest("#copyTxt")){copyText();return}
 if(e.target.closest("#saveNote")){saveFile("txt");return}
 if(e.target.closest("#savePdf")){saveFile("pdf");return}
 if(e.target.closest("#loadEx")){loadExamples();return}
 if(e.target.closest("#clearEx")){clearExamples();return}
 if(e.target.closest("#cancel")||e.target===$("#sheet")){closeForm();return}
 const del=e.target.closest("#del");if(del){deleteItem(del);return}
});
document.addEventListener("change",e=>{
 if(e.target.id==="wksel"){ui.week={y:ui.week.y,w:+e.target.value};render()}
 if(e.target.id==="quota")setQuota(e.target.value);
 if(e.target.id==="bkFile"&&e.target.files&&e.target.files[0])readBackup(e.target.files[0]);
 if(e.target.dataset&&e.target.dataset.pref)setPref(e.target.dataset.pref,e.target.value);
});
document.addEventListener("submit",e=>{if(e.target.id==="f")submitForm(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeForm()});
boot();

</script>
