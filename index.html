<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Hangar Est</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: outil mobile d'abord — en-tête collant avec onglets comptés, filtres, liste de fiches, bouton d'ajout flottant, formulaire en volet. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e3e9ee; --ink:#13202b; --muted:#5a6b79; --line:#d3dce4;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde7dc;
  --ok:#2f7d3b; --ok-soft:#e1f2e3; --bad:#b42323; --bad-soft:#fbe3e3; --warn:#9a5a00; --warn-soft:#fdf0d9;
  --ba:#1d5fa8; --bb1:#0f7a72; --bb2:#6a3fb5; --bmap:#9a5a00; --dep:#7c3aed; --dep-soft:#ede5fd;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141a; --surface:#152029; --sunk:#1b2833; --ink:#e4ebf1; --muted:#90a1af; --line:#26343f;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#62c675; --ok-soft:#173222; --bad:#ff7070; --bad-soft:#3a1b1b; --warn:#f2a94a; --warn-soft:#382a14;
  --ba:#6aa8f0; --bb1:#45c4b8; --bb2:#a988ef; --bmap:#f2a94a; --dep:#9d6cf5; --dep-soft:#2a1d45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#152029; --sunk:#1b2833; --ink:#e4ebf1; --muted:#90a1af; --line:#26343f;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#62c675; --ok-soft:#173222; --bad:#ff7070; --bad-soft:#3a1b1b; --warn:#f2a94a; --warn-soft:#382a14;
  --ba:#6aa8f0; --bb1:#45c4b8; --bb2:#a988ef; --bmap:#f2a94a; --dep:#9d6cf5; --dep-soft:#2a1d45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 0;display:grid;gap:12px}
header .tabs{margin-inline:-4px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
#sub:empty{display:none}
h1 small{display:block;font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;min-width:0;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 6px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.72rem;background:var(--sunk);border-radius:20px;padding:1px 7px;color:var(--ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:14px 110px;display:grid;gap:12px}
.note{font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 12px;font:500 .85rem var(--f-body);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--muted)}
.card.past{opacity:.72}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top .status{margin-left:auto}
.dest{font-family:var(--f-display);font-weight:600;font-size:1.35rem;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.when{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.when b{color:var(--ink);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:2px 7px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:500}
.status{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.status.live{border-color:var(--ok);color:var(--ok)}
.status.soon{border-color:var(--accent);color:var(--accent)}
.badge{font-family:var(--f-mono);font-size:.72rem;font-weight:500;border-radius:4px;padding:1px 6px;border:1.5px solid currentColor}
.badge[data-b="Tech A"]{color:var(--ba)}.badge[data-b="Tech B1"]{color:var(--bb1)}.badge[data-b="Tech B2"]{color:var(--bb2)}.badge[data-b="MAP"],.badge[data-b="MAP B1"],.badge[data-b="MAP B2"],.badge[data-b="MAP B3"]{color:var(--bmap)}.badge[data-b="Tech B3"]{color:#b4532a}.badge[data-b^="Stagiaire"]{color:var(--muted);border-style:dashed}
.crew{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.85rem}
.crew span{display:inline-flex;gap:6px;align-items:center}
.crew b{font-weight:700}
.crew .none{color:var(--muted);font-style:italic}
.warns{display:grid;gap:2px;font-size:.82rem;color:var(--bad)}
.warns div::before{content:"⚠ "}
.tech-name{font-weight:600;font-size:1.05rem}
.notes{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:10px;justify-items:start}
.empty h2{margin:0;font-family:var(--f-display);font-size:1.3rem}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:600 .9rem var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:16px}}
.panel h2{margin:0 0 14px;font-family:var(--f-display);font-size:1.5rem}
form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--bg)}
.seg input:checked+label{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.picker{display:grid;gap:6px}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick .nm{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.pick .fl{font-size:.75rem;color:var(--muted);white-space:nowrap}
.pick .fl .no{color:var(--bad);font-weight:600}
.dur{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);margin:-6px 0 0}
.err{color:var(--bad);font-size:.85rem;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.actions .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
.foot{display:flex;justify-content:flex-end}
/* arrière-plans au choix */
:root{--on-bg-muted:var(--muted)}
:root[data-bg="white"]{--bg:#ffffff}
:root[data-bg="red"]{--bg:#c62828;--on-bg-muted:rgba(255,255,255,.88)}
@media (prefers-color-scheme: dark){:root[data-bg="white"]:not([data-theme="light"]){--bg:#080c10}:root[data-bg="red"]:not([data-theme="light"]){--bg:#4a0d10;--on-bg-muted:rgba(255,220,220,.85)}}
:root[data-bg="white"][data-theme="dark"]{--bg:#080c10}
:root[data-bg="red"][data-theme="dark"]{--bg:#4a0d10;--on-bg-muted:rgba(255,220,220,.85)}
.btn.link{color:var(--on-bg-muted)}
.hrow{display:flex;align-items:flex-start;gap:12px}
.hrow h1{flex:1;min-width:0}
.gear{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer}
.settings{display:grid;gap:16px;margin-bottom:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 .9rem var(--f-body);cursor:pointer}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}
.sw-grey{background:#eef2f5}.sw-white{background:#ffffff}.sw-red{background:#c62828}
.quota{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrow input{width:64px;text-align:center;font:600 1.1rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.qcount{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.qinfo{margin:0;font-size:.82rem;font-weight:600;color:var(--ok)}
.qinfo.full{color:var(--bad)}
.pick.locked{opacity:.45;cursor:not-allowed}
header .tabs{gap:0}
header .tab{flex:1 1 auto;min-width:0;flex-direction:column;gap:3px;padding:6px 0 8px;font-size:clamp(.56rem,2.6vw,.92rem);letter-spacing:-.015em}
header .tab .ti{position:relative;font-size:1.25rem;line-height:1}
header .tab .ti .n{position:absolute;top:-7px;inset-inline-start:calc(100% - 4px);font-size:.6rem;padding:0 4px;line-height:1.4}
header .tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[data-tab="convoyages"]{border-inline-start:1px solid var(--line);margin-inline-start:4px}
.tabs2 .tab{font-size:1rem;padding-top:10px}
.tabs2 .tab[aria-selected="true"]{color:var(--accent)}
.weekbar .wrange{flex-basis:100%;order:9;white-space:nowrap}

.tab{flex:1 0 auto}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.caltitle{margin:0;font-family:var(--f-display);font-size:1.35rem;flex:1;min-width:0;text-align:center}
html[lang="ar"] .caltitle{font-family:"IBM Plex Sans Arabic",var(--f-display)}
.calview{flex:1 1 auto}
.vbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--on-bg-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.wdn{font-size:.7rem;text-align:center;color:var(--muted);text-transform:capitalize;padding-bottom:2px}
.wn{font-family:var(--f-mono);font-size:.65rem;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;align-self:center}
.wn.h{color:var(--muted);cursor:default}
.day{min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit}
.day.out{opacity:.4}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:50%}
.day.sel{outline:2px solid var(--ink);outline-offset:-1px}
.dn{font:600 .85rem var(--f-mono);width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;font:600 .62rem var(--f-mono);font-style:normal;color:#fff;padding:0 3px}
.legend .dot{min-width:12px;height:12px}
.dot.c{background:var(--accent)}.dot.m{background:var(--ba)}
.daypanel,.wkview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.dphead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.dphead h3{margin:0;font-size:1.05rem}
.dpbtns{display:flex;gap:6px;flex-wrap:wrap}
.dpbtns .btn{padding:7px 10px;font-size:.85rem}
main .wrap{min-width:0}
.daypanel,.calbar,.cal{min-width:0;max-width:100%}
.rlist{display:grid;gap:6px}
.ritem{display:grid;gap:2px;text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit}
.ritem.m{border-inline-start-color:var(--ba)}
.rtag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.who{font-size:.85rem;color:var(--muted)}
.wday{display:grid;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.wday:last-child{border-bottom:0}
.wdh{text-align:start;background:none;border:0;padding:0;font:600 .95rem var(--f-body);color:var(--ink);cursor:pointer}
.wday.today .wdh{color:var(--accent)}
.wday.sel .wdh{text-decoration:underline}
.ntext{white-space:pre-wrap;font-size:.9rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
textarea.big{min-height:180px}
.lvbal{font-size:1rem;margin:4px 0;color:var(--ok)}
.lvbal.neg{color:var(--bad)}
.lvlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0}
.lvlegend span{display:inline-flex;align-items:center;gap:5px}
.lvlegend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lvcal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.lvm b{display:block;margin-bottom:4px}
.lvg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
.lvh{color:var(--muted);font-size:.7rem}
.lvd{padding:4px 0;border-radius:5px;background:var(--bg)}
.lvd.sun{color:var(--muted)}
.lvd.in.sun{background:var(--sunk)}
.lvd.hol{background:var(--warn-soft);color:var(--warn);font-weight:700}
.lvd.cnt{background:var(--ok);color:#fff;font-weight:700}
i.lvd.cnt{background:var(--ok)}i.lvd.sun{background:var(--sunk)}i.lvd.hol{background:var(--warn-soft);outline:1px solid var(--warn)}
.hollist{display:grid;gap:4px;max-height:38vh;overflow:auto;margin:8px 0}
.holrow{display:grid;grid-template-columns:auto minmax(0,1fr) 32px;gap:8px;align-items:center;font-size:.88rem}
.holrow .wbtn{width:32px;height:32px;font-size:.9rem}
.cvrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;margin:8px 0}
.cvin{width:100%;font:600 1.4rem var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cvres{font:700 1.4rem var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;min-height:52px}
.cvswap{justify-self:start}
.cvall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}
.cvall div{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-variant-numeric:tabular-nums}
.cvall span{color:var(--muted)}
.cctable td.pos b{color:var(--ok)}
.cctable td.neg b{color:var(--bad)}
.cctable small{color:var(--muted)}
.caution{border:2px solid #f5a300;border-radius:6px;margin:4px 0 14px;overflow:hidden;background:#fff6d6}
.caution b{display:block;background:#f5a300;color:#111;text-align:center;letter-spacing:.12em;font-size:.95rem;padding:4px}
.caution p{margin:0;padding:8px 10px;color:#3d2c00;font-weight:700;font-size:.92rem;line-height:1.35}
.sechrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.top .tech-name{font-size:1.15rem;margin-inline-end:2px;overflow-wrap:anywhere;min-width:0}
.calbar .caltitle{flex:1 1 calc(100% - 100px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.45rem;text-transform:capitalize}
.calbar .calview{order:5;flex:1 1 auto;display:flex;gap:6px}

.chip.dep{background:var(--dep-soft);color:var(--dep)}
.bar.d{background:var(--dep);color:#fff}

.histbtn{justify-self:start}
.sel{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hwrap{display:grid;gap:12px;margin:12px 0}
.hweek{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.hhead{display:flex;gap:10px;align-items:baseline;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;text-align:start}
.hhead b{font-family:var(--f-display);font-size:1.3rem;color:var(--accent)}
.hhead span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.hsum{display:flex;gap:6px;flex-wrap:wrap}
.hlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.hlist li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.hmeta{color:var(--muted);font-size:.82rem}
.lw{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 4px}
.dpick{display:grid;gap:8px}
.dpweek{display:flex;align-items:center;gap:10px}
.dpweek b{font-family:var(--f-mono);font-size:.95rem;min-width:90px;text-align:center}
.dpdays{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:thin}
.dpdays input{position:absolute;opacity:0;pointer-events:none}
.dpdays label{flex:none;scroll-snap-align:center;border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.dpdays label.we{border-color:var(--accent);color:var(--accent)}
.dpdays input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dpdays input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.dpnav{display:flex;gap:8px}
.dpnav .btn{flex:1}
html,body{background:var(--bg)}
.cal{display:block;padding:6px}
.wrow{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));column-gap:3px;row-gap:3px;padding-block:3px}
.wrow.head{padding-bottom:0}
.cal .day{grid-row-end:auto;min-height:62px;align-items:flex-start;justify-content:flex-start;padding:3px;border-radius:6px}
.wrow>.dn,.wrow .wn{align-self:start;padding-top:6px}
.bar{position:relative;z-index:1;align-self:center;height:20px;margin:0 2px;border:0;border-radius:6px;color:#fff;font:600 .68rem var(--f-body);padding:0 6px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.bar.m{background:var(--ba)}.bar.c{background:var(--accent);color:var(--accent-ink)}
.bar.cl{border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:-4px}
.bar.cr{border-start-end-radius:0;border-end-end-radius:0;margin-inline-end:-4px}
.wpad{height:2px}
.lbar{display:inline-block;width:22px;height:8px;border-radius:4px}
.lbar.c{background:var(--accent)}.lbar.m{background:var(--ba)}
.dchips{margin:-6px 0 12px}
.dgrid{display:grid;gap:8px;margin-bottom:14px}
.drow{display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}

.dtech{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;text-align:start;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;cursor:pointer}
.panel .warns{margin-bottom:12px}

.bkrow{display:flex;gap:8px;flex-wrap:wrap}

/* arabe : droite à gauche */
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic",var(--f-body)}
html[lang="ar"] h1,html[lang="ar"] .dest,html[lang="ar"] .panel h2,html[lang="ar"] .empty h2{font-family:"IBM Plex Sans Arabic",var(--f-display);letter-spacing:0}

html[dir="rtl"] .top .status{margin-left:0;margin-right:auto}
html[dir="rtl"] .hint{padding-left:0;padding-right:28px}

.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.wsel{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:700;font-size:1.5rem}
.wsel select{font:inherit;color:var(--accent);background:transparent;border:0;padding:0 2px;cursor:pointer}
.wsel span{font-family:var(--f-mono);font-size:.75rem;font-weight:400;color:var(--muted)}
.wrange{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:1;min-width:0}
.weekbar .share{margin-left:auto}
.rotation{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.rotation summary{cursor:pointer;font-weight:600}
.rotation ul{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:6px}
.rotation li{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.9rem}
.rotation .rot{color:var(--muted);flex-basis:100%}
.rotation strong{color:var(--ok)}
.hint{flex-basis:100%;font-size:.75rem;color:var(--muted);padding-left:28px}
.hint:empty{display:none}
.hint.sugg{color:var(--ok);font-weight:600}
.hint.busy{color:var(--bad);font-weight:600}
.pick{flex-wrap:wrap}
.preview{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:40vh;overflow:auto;margin:0 0 12px}
.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-actions .btn{text-align:center;text-decoration:none}
.btn.wa{grid-column:1/-1;background:var(--ok);border-color:var(--ok);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* ==== thème professionnel ==== */
:root{--brand:#0e2742;--brand-2:#173a61;--on-brand:#ffffff;--on-brand-muted:rgba(255,255,255,.72);
 --bg:#f2f4f7;--surface:#ffffff;--sunk:#eceff3;--ink:#0f1b2a;--muted:#5b6b7c;--line:#dde3ea;
 --accent:#1d5fa8;--accent-ink:#ffffff;--accent-soft:#e7f0fb;
 --shadow-1:0 1px 2px rgba(15,27,42,.06),0 1px 1px rgba(15,27,42,.04);--shadow-2:0 6px 18px rgba(15,27,42,.10);--r:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#0a1a2c;--brand-2:#10263f;--bg:#0b121a;--surface:#131d28;--sunk:#1a2633;--ink:#e6edf3;--muted:#93a3b3;--line:#253445;--accent:#6aa6f2;--accent-ink:#06172b;--accent-soft:#16304d;--shadow-1:none;--shadow-2:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--brand:#0a1a2c;--brand-2:#10263f;--bg:#0b121a;--surface:#131d28;--sunk:#1a2633;--ink:#e6edf3;--muted:#93a3b3;--line:#253445;--accent:#6aa6f2;--accent-ink:#06172b;--accent-soft:#16304d;--shadow-1:none;--shadow-2:0 8px 24px rgba(0,0,0,.4)}
:root[data-bg="white"]{--bg:#ffffff}
body{font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{background:var(--brand)}
/* en-tête */
header{background:linear-gradient(180deg,var(--brand),var(--brand-2));border-bottom:0;box-shadow:0 2px 10px rgba(8,20,36,.18);color:var(--on-brand)}
header .wrap{padding-block:12px 0;gap:10px}
h1{color:var(--on-brand);font-size:1.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
h1 small{color:var(--on-brand-muted)}
.gear{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--on-brand);border-radius:10px;width:40px;height:40px}
.gear:hover{background:rgba(255,255,255,.18)}
.spaces:not(.home){background:rgba(255,255,255,.1);border-radius:12px;padding:4px}
.space.cur{background:var(--surface);color:var(--accent);box-shadow:none;font-weight:700}
.space.exit{color:var(--on-brand);font-weight:600}
.space.exit:hover{color:#ffd2d2}
.tabs{padding-bottom:2px}
.tab{color:var(--on-brand-muted);border-bottom-width:3px}
.tab[aria-selected="true"]{color:var(--on-brand);border-bottom-color:#ffffff}
.tab .n{background:rgba(255,255,255,.18);color:var(--on-brand)}
.tab .ti .n{background:#e8eef6;color:var(--brand)}
.tab[data-tab="convoyages"]{border-inline-start-color:rgba(255,255,255,.22)}
/* accueil */
header:has(.spaces.home){background:linear-gradient(180deg,var(--brand) 0,var(--brand-2) 96px,transparent 96px);box-shadow:none;position:relative}
.spaces.home{gap:12px;padding-top:10px}
.spaces.home .space{flex-direction:row;justify-content:flex-start;gap:16px;padding:16px 18px;font:700 1.15rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);text-align:start}
.spaces.home .space span{display:grid;place-items:center;width:62px;height:62px;flex:none;border-radius:14px;background:var(--accent-soft);font-size:1.7rem;letter-spacing:-.12em}
.spaces.home .space::after{content:"›";margin-inline-start:auto;font-size:1.9rem;line-height:1;color:var(--muted);font-weight:400}
.spaces.home .space:hover{border-color:var(--accent);transform:translateY(-1px)}
/* contenus */
main .wrap{padding-block:16px 110px;gap:14px}
.card,.weekbar,.empty,.csec,.tplcard,.tscard,.ccrow,.vday{box-shadow:var(--shadow-1)}
.card{border-radius:var(--r);padding:14px 16px}
.card:hover,.tplcard:hover,.tscard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow-2)}
.tplgrid{gap:10px}
.tplcard{border-radius:14px;padding:18px 10px 14px;transition:box-shadow .15s,border-color .15s}
.tplcard .tplic{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);font-size:1.6rem}
.tplcard .tplname{font-weight:700;font-size:.98rem;text-align:center;line-height:1.25}
.sech{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.csec{border-radius:14px;overflow:hidden}
.csec>summary{font-family:var(--f-body);font-size:1.05rem;font-weight:700;padding:16px 18px}
.csec[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px;background:var(--sunk)}
.csec>section{padding:0 14px 14px}
.weekbar{border-radius:var(--r)}
/* boutons */
.btn{min-height:42px;border-radius:10px;padding:9px 14px;font:600 .92rem var(--f-body);transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn.primary{box-shadow:0 1px 2px rgba(29,95,168,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.link{min-height:0}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.fab{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(29,95,168,.35);font-weight:700}
.fchip{border-radius:999px;padding:6px 14px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{border-radius:6px}
/* formulaires */
input[type=text],input[type=date],input[type=search],input[type=number],input[type=password],textarea,select,.sel,.tplfields input,.vrow input,.pnrow input,.lrow input{background:var(--surface);border:1px solid var(--line);border-radius:10px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.lbl,.tfl{color:var(--muted);font-weight:600}
.preview{border-radius:10px}
/* volets */
.sheet{background:rgba(8,18,30,.55);backdrop-filter:blur(2px)}
.panel{border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(8,18,30,.25)}
@media (min-width:700px){.panel{border-radius:20px}}
.panel h2{font-family:var(--f-body);font-size:1.3rem;font-weight:800;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.toast{border-radius:10px;box-shadow:var(--shadow-2)}

function readBackup(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j&&j.app==="convoyages-missions"?j.data:(j&&Array.isArray(j.techs)?j:null);if(!d)throw 0;pendingImport=normalize(d);openSettings()}catch(e){toast(T("bk_bad"))}};r.readAsText(file)}
function applyImport(){const keepPrefs=state.prefs;state=pendingImport;if(!state.prefs)state.prefs=keepPrefs;pendingImport=null;adoptPrefs();closeForm();render();persist();toast(T("bk_done"))}

/* ---------- semaines ISO ---------- */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
function weekStart(y,w){const j4=new Date(Date.UTC(y,0,4));const day=j4.getUTCDay()||7;const m=new Date(j4);m.setUTCDate(j4.getUTCDate()-day+1+(w-1)*7);return m}
const weeksIn=y=>isoWeek(new Date(y,11,28)).w;
const iso=d=>d.toISOString().slice(0,10);
function plus(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x}
let ui={tab:"convoyages",filter:{depannages:"all",missions:"all",convoyages:"all",techs:"all"},week:isoWeekNow(),cal:(()=>{const t=todayStr();return{y:+t.slice(0,4),m:+t.slice(5,7)-1,sel:t,view:"month"}})()};
function occIn(c,ws){if(!c.date)return null;const wss=iso(ws),wes=iso(plus(ws,6));
 if(!c.repeat)return(c.date>=wss&&c.date<=wes)?c.date:null;
 const wd=(new Date(c.date+"T00:00:00Z").getUTCDay()+6)%7;const os=iso(plus(ws,wd));
 if(os<c.date||(c.until&&os>c.until))return null;return os}
function itemsOfWeek(y,w){const ws=weekStart(y,w);return state.convoyages.map(c=>({c,d:occIn(c,ws)})).filter(x=>x.d).sort((a,b)=>(!!a.c.noday-!!b.c.noday)||a.d.localeCompare(b.d))}
const weekItems=()=>itemsOfWeek(ui.week.y,ui.week.w);
function weekRange(){const ws=weekStart(ui.week.y,ui.week.w);return[iso(ws),iso(plus(ws,6))]}
function missionWeek(){const[a,b]=weekRange();return state.missions.filter(m=>m.debut&&m.debut<=b&&(m.fin||m.debut)>=a)}
const wkey=(y,w)=>`${y}-W${w}`;
const quotaOf=(y,w)=>+(state.quota[wkey(y,w)]||0);
function crewOfWeek(y,w,excl){const s=new Set();itemsOfWeek(y,w).forEach(({c})=>{if(c.id!==excl)(c.techs||[]).forEach(id=>{if(techById(id))s.add(id)})});return s}

/* occupation : le technicien est-il déjà pris ce jour-là ? */
function busyOn(tid,d,excl){
 for(const m of state.missions){if(m.id!==excl&&(m.techs||[]).includes(tid)&&m.debut&&m.debut<=d&&(m.fin||m.debut)>=d)return T("busy_m")+" "+(m.destination||"");}
 for(const m of state.depannages){if(m.id!==excl&&(m.techs||[]).includes(tid)&&m.debut&&m.debut<=d&&(m.fin||m.debut)>=d)return T("busy_d")+" "+(m.objet||"");}
 for(const c of state.convoyages){if(c.id===excl||!(c.techs||[]).includes(tid)||!c.date||c.noday)continue;
  if(!c.repeat){if(c.date===d)return T("busy_c")+" "+(c.destination||V(c.zone))}
  else if(d>=c.date&&(!c.until||d<=c.until)&&((Date.parse(d)-Date.parse(c.date))/864e5)%7===0)return T("busy_c")+" "+(c.destination||V(c.zone))}
 return null}
function busyRange(tid,a,b,excl){if(!a)return null;b=b||a;let d=new Date(a+"T00:00:00Z");for(let i=0;i<62&&iso(d)<=b;i++,d=plus(d,1)){const r=busyOn(tid,iso(d),excl);if(r)return r}return null}
function conflicts(ids,a,b,excl){const w=[];(ids||[]).forEach(id=>{const t=techById(id);if(!t)return;const lv=leaveRange(t,a,b);if(lv)w.push(T("warn_leave",t.nom,fmtShort(lv.debut),fmt(lv.fin)));const r=busyRange(id,a,b,excl);if(r)w.push(T("warn_busy",t.nom,r.trim()))});return w}

/* rotation : nature faite la semaine précédente → nature suggérée */
function lastNature(tid,y,w){let py=y,pw=w-1;if(pw<1){py--;pw=weeksIn(py)}const ws=weekStart(py,pw);let n=null;
 for(const c of state.convoyages){if(!(c.techs||[]).includes(tid))continue;if(occIn(c,ws)){if(c.nature==="Double")return"Double";if(c.nature==="Simple")n="Simple"}}return n}
const opposite=n=>n==="Double"?"Simple":n==="Simple"?"Double":null;
function rotationPanel(){if(!state.techs.length)return"";const{y,w}=ui.week;const pw=w===1?weeksIn(y-1):w-1;
 const rows=[...state.techs].sort((a,b)=>a.nom.localeCompare(b.nom)).map(t=>{const l=lastNature(t.id,y,w);return`<li><b>${esc(t.nom)}</b><span class="badge" data-b="${esc(t.badge)}">${esc(t.badge)}</span><span class="rot">${l?T("rot_line",pw,V(l),V(opposite(l))):T("rot_free")}</span></li>`}).join("");
 return`<details class="rotation"><summary>${T("rot_title",w)}</summary><ul>${rows}</ul><p class="notes">${T("rot_note")}</p></details>`}

/* ---------- historique des convoyages ---------- */
function prevWeek(y,w){return w>1?{y,w:w-1}:{y:y-1,w:weeksIn(y-1)}}
function histFilterTech(){return (editing&&editing.histTech)||""}
function openHistory(tech){editing={kind:"hist",histTech:tech||""};const sel=tech||"";
 let{y,w}=ui.week;const now=isoWeek(new Date());if(y>now.y||(y===now.y&&w>now.w)){y=now.y;w=now.w}
 let html="";let shown=0;
 for(let i=0;i<52;i++){const items=itemsOfWeek(y,w);const rows=[];let s=0,dbl=0;
  items.forEach(({c,d})=>{(c.techs||[]).map(techById).filter(Boolean).forEach(t=>{if(sel&&t.id!==sel)return;rows.push({t,c,d});if(c.nature==="Double")dbl++;else s++})});
  if(rows.length){shown++;const ws=weekStart(y,w);const q=quotaOf(y,w);
   html+=`<section class="hweek"><button type="button" class="hhead" data-goweek="${y}-${w}"><b>S${w}</b><span>${fmtShort(iso(ws))} – ${fmt(iso(plus(ws,6)))}</span></button>
   <div class="hsum"><span class="chip">${T("v_Simple")} : ${s}</span><span class="chip acc">${T("v_Double")} : ${dbl}</span>${q?`<span class="chip">${T("q_label")} : ${q}</span>`:""}</div>
   <ul class="hlist">${rows.map(({t,c,d})=>`<li><b>${esc(t.nom)}</b><span class="badge" data-b="${esc(t.badge)}">${esc(t.badge)}</span><span class="hmeta">${V(c.nature)} · ${V(c.zone)} · ${c.noday?T("day_tbd"):shortDay(d)}</span></li>`).join("")}</ul></section>`}
  ({y,w}=prevWeek(y,w))}
 const opts=`<option value="">${T("h_all")}</option>`+[...state.techs].sort((a,b)=>a.nom.localeCompare(b.nom)).map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.nom)}</option>`).join("");
 $("#panel").innerHTML=`<h2>${T("h_title")}</h2>
 <label class="field" for="histTech"><span class="lbl">${T("f_techs")}</span><select id="histTech" class="sel">${opts}</select></label>
 <div class="hwrap">${shown?html:`<p class="notes">${T("h_none")}</p>`}</div>
 <div class="actions"><span class="sp"></span><button type="button" class="btn primary" id="cancel">${T("close")}</button></div>`;
 $("#sheet").hidden=false}
function shortDay(d){const s=new Date(d+"T00:00:00").toLocaleDateString(LOC[LANG],{weekday:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}

function dayPicker(dstr,nd){const wk=weekOf(dstr);const ws=weekStart(wk.y,wk.w);const idx=Math.round((Date.parse(dstr)-ws.getTime())/864e5);
 const rtl=LANG==="ar";

 <div class="dpick"><div class="dpweek"><button type="button" class="wbtn" data-dpw="-1" aria-label="${T("wk_prev")}">${rtl?"›":"‹"}</button><b id="dpwl">S${wk.w} · ${wk.y}</b><button type="button" class="wbtn" data-dpw="1" aria-label="${T("wk_next")}">${rtl?"‹":"›"}</button></div>
 <div class="dpdays" id="dpdays"><input type="radio" id="dpd-x" name="dpday" value="x" ${nd?"checked":""}><label for="dpd-x" class="nd">${T("day_tbd")}</label>${Array.from({length:7},(_,i)=>{const nm=shortDay(iso(plus(ws,i)));return`<input type="radio" id="dpd-${i}" name="dpday" value="${i}" ${!nd&&i===idx?"checked":""}><label for="dpd-${i}" class="${i>=4?"we":""}">${nm}</label>`}).join("")}</div>

function dpSync(){const h=$("#f-date");if(!h)return;const wk=weekOf(h.value);const ws=weekStart(wk.y,wk.w);const idx=Math.round((Date.parse(h.value)-ws.getTime())/864e5);
 $("#dpwl").textContent=`S${wk.w} · ${wk.y}`;const nd=$("#f-noday").value==="1";document.querySelectorAll("#dpdays input").forEach(r=>r.checked=nd?r.value==="x":(r.value!=="x"&&+r.value===idx));
 const lab=document.querySelector(`#dpdays label[for="dpd-${nd?"x":idx}"]`);if(lab)lab.scrollIntoView({block:"nearest",inline:"center"});liveForm()}

function defDateC(){const{y,w}=ui.week;return iso(plus(weekStart(y,w),4))}

function quotaBar(){const{y,w}=ui.week;const q=quotaOf(y,w);const n=crewOfWeek(y,w).size;
 let st="";if(q>0)st=n>=q?`<span class="chip ${n>q?"bad":"ok"}">${T("q_full")}</span>`:`<span class="chip acc">${T("q_left",q-n)}</span>`;

 <span class="qcount">${q>0?T("q_count",n,q):""}</span>${st}</div>${q>0?"":`<p class="notes">${T("q_none")}</p>`}</div>`}

function defDate(){const[a,b]=weekRange();const t=todayStr();return t>=a&&t<=b?t:a}
function weekOf(dstr){return isoWeek(new Date(dstr+"T00:00:00"))}
function weekBar(){const{y,w}=ui.week;const[a,b]=weekRange();const n=weeksIn(y);const rtl=LANG==="ar";
 return`<div class="weekbar"><button class="wbtn" data-wk="-1" aria-label="${T("wk_prev")}">${rtl?"›":"‹"}</button>
 <label class="wsel" for="wksel"><select id="wksel">${Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===w?"selected":""}>S${i+1}</option>`).join("")}</select><span>${y}</span></label>
 <span class="wrange">${fmtShort(a)} – ${fmt(b)}</span>
 <button class="wbtn" data-wk="1" aria-label="${T("wk_next")}">${rtl?"‹":"›"}</button>
 <button class="btn primary share" id="shareBtn">${T("share_btn",w)}</button></div>`}
function shiftWeek(n){let{y,w}=ui.week;w+=n;if(w<1){y--;w=weeksIn(y)}else if(w>weeksIn(y)){y++;w=1}ui.week={y,w};render()}

function mStatus(m){const t=todayStr();if(!m.debut)return[T("st_plan"),""];const fin=m.fin||m.debut;if(t<m.debut)return[T("st_soon"),"soon"];if(t>fin)return[T("st_done_f"),"past"];return[T("st_live_f"),"live"]}
function cStatus(c,d){d=d||c.date;const t=todayStr();if(!d)return[T("st_plan"),""];if(t<d)return[T("st_soon"),"soon"];if(t>d)return[T("st_done"),"past"];return[T("st_today"),"live"]}
function warns(item,zone){const w=[];(item.techs||[]).forEach(id=>{const t=techById(id);if(!t)return;if(zone==="Europe"&&!t.visa)w.push(T("warn_visa",t.nom));if(zone==="Afrique"&&!t.vaccin)w.push(T("warn_vac",t.nom))});return w}

<div class="dest">${esc(m.destination||T("dest_tbd"))}</div>

const telClean=t=>String(t||"").replace(/[^\d+]/g,"");

function contactsList(){const q=(ui.csearch||"").trim().toLowerCase();const qd=q.replace(/\D/g,"");
 const all=[...(state.contacts||[])].sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr",{sensitivity:"base"}));
 if(!all.length)return`<div class="empty"><h2>${T("c_empty")[0]}</h2><p>${T("c_empty")[1]}</p></div>`;
 const list=all.filter(c=>!q||(c.nom||"").toLowerCase().includes(q)||(c.fonction||"").toLowerCase().includes(q)||(qd&&telClean(c.tel).includes(qd)));

 let cur="",h="";list.forEach(c=>{const L=(((c.nom||"?").trim()[0]||"?").normalize("NFD")[0]).toUpperCase();if(L!==cur){cur=L;h+=`<div class="cletter" id="cl-${esc(L)}">${esc(L)}</div>`}

function parseVcf(txt){txt=txt.replace(/\r\n[ \t]/g,"").replace(/\n[ \t]/g,"");const out=[];
 txt.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{let fn=(b.match(/^FN[^:\n]*:(.*)$/mi)||[])[1];if(!fn){const n=(b.match(/^N[^:\n]*:(.*)$/mi)||[])[1];if(n){const p=n.split(";");fn=[p[1],p[0]].filter(Boolean).join(" ")}}
  const org=(b.match(/^(?:TITLE|ORG)[^:\n]*:(.*)$/mi)||[])[1];const tels=[...b.matchAll(/^(?:item\d+\.)?TEL[^:\n]*:(.*)$/gmi)].map(m=>m[1].trim()).filter(Boolean);
  if(tels[0])out.push({nom:(fn||"").replace(/\\,/g,",").replace(/\\;/g,";").trim()||tels[0],tel:tels[0],fonction:(org||"").replace(/;+$/,"").replace(/;/g," ").trim()})});return out}
function addContacts(list){state.contacts=state.contacts||[];const have=new Set(state.contacts.map(c=>telClean(c.tel).slice(-9)));let n=0;
 list.forEach(c=>{const k=telClean(c.tel).slice(-9);if(!k||have.has(k))return;have.add(k);state.contacts.push({id:uid(),nom:c.nom||c.tel,tel:c.tel,fonction:c.fonction||""});n++});
 if(n){render();persist();toast(T("c_imported",n))}else toast(T("c_none"))}
async function pickContacts(){try{const r=await navigator.contacts.select(["name","tel"],{multiple:true});addContacts((r||[]).map(x=>({nom:(x.name&&x.name[0])||"",tel:(x.tel&&x.tel[0])||""})))}catch(e){}}
function readVcf(file){const r=new FileReader();r.onload=()=>addContacts(parseVcf(String(r.result||"")));r.readAsText(file)}

const TANKS={"B737 NG/MAX":[4875,16269,4875],"B787-8/9":[34500,57200,34500],"B767":[16240,58900,16240],"Embraer E190":[8076,0,8076],"ATR 72":[3185,0,3185]};

 const rows=names.map((n,i)=>capL[i]===0?"":`<tr><td><b>${n}</b></td><td class="pos"><b>${f(b[i])}</b></td><td>${f(b[i]/d)} L</td></tr>`).join("");

 const text=[`Calcul fuel CVG — ${ui.fc.type}`,``,`Quantité demandée : ${r(fin)} kg (${r(fin/d)} L)`,`Densité : ${String(d).replace(".",",")}`,``,...names.map((n,i)=>capL[i]===0?null:`${n} : ${r(b[i])} kg (${r(b[i]/d)} L)`).filter(Boolean),``,`CAUTION : ATT REFER TO AMM`].join("\n");

/* ---------- transfert entre applications ---------- */
const TR_CATS=[["visits","📋 Programme visites"],["contacts","📒 Répertoire"],["parts","🔩 P/N"],["techs","👷 Techniciens"],["taskSheets","🗂️ Répartition des tâches"],["renforts","💪 Renforts"],["formations","🎓 Formations"],["annonces","📢 Messages aux techniciens"],["releves","🔄 Relèves (consignes)"],["plan","✈️ CVG, missions et dépannages"],["notes","📝 Notes"],["tpl","✏️ Modèles de messages modifiés"]];
let trSel=new Set(["visits","contacts","parts"]),trPending=null;
const trCount=(k,d)=>k==="visits"?Object.values(d.visits||{}).reduce((a,w)=>a+Object.values(w.days||{}).reduce((x,r)=>x+r.length,0),0):k==="plan"?(d.convoyages||[]).length+(d.missions||[]).length+(d.depannages||[]).length:k==="tpl"?Object.keys(d.tpl||{}).length:(d[k]||[]).length;
function trBuild(){const sel=new Set(trSel);if(sel.has("plan"))sel.add("techs");const d={};
 sel.forEach(k=>{if(k==="plan"){d.convoyages=state.convoyages;d.missions=state.missions;d.depannages=state.depannages}else if(k==="taskSheets"){d.taskSheets=state.taskSheets;d.tsCats=state.tsCats}else d[k]=state[k]});
 return{app:"hangar-est-transfert",v:1,date:new Date().toISOString(),cats:[...sel],techRef:state.techs.map(t=>({id:t.id,nom:t.nom})),data:JSON.parse(JSON.stringify(d))}}
function openTransfer(){editing={kind:"transfer"};const P=trPending;
 $("#panel").innerHTML=`<h2>🔄 Transfert entre applications</h2>
 ${P?`<div class="bkconfirm trin"><p><b>Données reçues</b> (${new Date(P.date).toLocaleDateString("fr-FR")}) :</p><div class="trlist">${TR_CATS.filter(([k])=>P.cats.includes(k)).map(([k,l])=>`<label class="tcrow"><span class="tcl"><input type="checkbox" data-trin="${k}" checked> ${l}</span><span class="chip">${trCount(k,P.data)}</span></label>`).join("")}</div>
  <p class="notes">Les éléments seront <b>ajoutés</b> à tes données. Ce qui existe déjà (même nom, même numéro, même P/N) n'est pas dupliqué, et rien n'est supprimé.</p>
  <div class="actions"><button type="button" class="btn" id="trCancel">Annuler</button><span class="sp"></span><button type="button" class="btn primary" id="trGo">Ajouter à mes données</button></div></div>`:""}
 <div class="field"><span class="lbl">📤 Envoyer vers un autre téléphone</span><p class="notes">Choisis ce que tu veux transférer :</p>
 <div class="trlist">${TR_CATS.map(([k,l])=>`<label class="tcrow"><span class="tcl"><input type="checkbox" data-trout="${k}" ${trSel.has(k)?"checked":""}> ${l}</span><span class="chip">${trCount(k,state)}</span></label>`).join("")}</div>
 <div class="tsbar"><button type="button" class="btn primary" id="trExport">📤 Exporter le fichier</button><button type="button" class="btn" id="trCopy">📋 Copier le code</button></div>
 <p class="notes">Le fichier s'envoie par WhatsApp, mail, AirDrop… Si l'envoi de fichier ne marche pas, copie le code et colle-le dans un message.</p></div>
 <div class="field"><span class="lbl">📥 Recevoir d'un autre téléphone</span>
 <div class="tsbar"><label class="btn" for="trFile">📄 Choisir le fichier reçu</label><input type="file" id="trFile" accept=".json,application/json,text/plain" hidden></div>
 <textarea id="trCode" placeholder="…ou colle ici le code reçu"></textarea><button type="button" class="btn" id="trPaste">Lire le code</button></div>
 <div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">${T("close")}</button></div>`;$("#sheet").hidden=false}
async function trExport(){const dl=await getDl();if(!dl){toast(T("t_shareFail"));return}if(!trSel.size){toast("Coche au moins un élément.");return}
 try{await dl.save({filename:`hangar-est-transfert-${todayStr()}.json`,data:JSON.stringify(trBuild())});toast("Fichier de transfert prêt")}catch(e){if(e&&e.code==="declined")return;toast(T("t_shareFail"))}}
async function trCopy(){if(!trSel.size){toast("Coche au moins un élément.");return}const code="HANGAREST:"+btoa(unescape(encodeURIComponent(JSON.stringify(trBuild()))));
 try{await navigator.clipboard.writeText(code);toast("Code copié : colle-le dans un message")}catch(e){$("#trCode").value=code;$("#trCode").select();toast("Code affiché : sélectionne-le et copie-le")}}
function trParse(txt){try{txt=String(txt||"").trim();if(txt.startsWith("HANGAREST:"))txt=decodeURIComponent(escape(atob(txt.slice(10).replace(/\s+/g,""))));const j=JSON.parse(txt);
 if(!j||j.app!=="hangar-est-transfert"||!j.data)throw 0;trPending=j;openTransfer()}catch(e){toast("Ce fichier ou ce code n'est pas un transfert Hangar Est.")}}
function trMerge(){const P=trPending;const inc=new Set([...document.querySelectorAll("[data-trin]:checked")].map(i=>i.dataset.trin));const d=P.data;const added={};const add=(k,n)=>added[k]=(added[k]||0)+n;
 // correspondance des techniciens par nom
 const map={};const byName=new Map(state.techs.map(t=>[normName(t.nom),t.id]));
 (P.techRef||[]).forEach(t=>{const ex=byName.get(normName(t.nom));if(ex)map[t.id]=ex});
 if(inc.has("techs")||inc.has("plan")){(d.techs||[]).forEach(t=>{if(map[t.id])return;const nt={...t};if(state.techs.some(x=>x.id===nt.id))nt.id=uid();state.techs.push(nt);map[t.id]=nt.id;byName.set(normName(nt.nom),nt.id);add("techs",1)})}
 const rid=id=>map[id]||null;const refT=arr=>(arr||[]).map(rid).filter(Boolean);
 const chipT=arr=>(arr||[]).map(t=>t.id?(rid(t.id)?{id:rid(t.id),nom:t.nom}:{id:"",nom:t.nom||((P.techRef||[]).find(x=>x.id===t.id)||{}).nom||""}):t).filter(t=>t.id||t.nom);
 const byId=(k,arr,fix)=>{state[k]=state[k]||[];const have=new Set(state[k].map(x=>x.id));(arr||[]).forEach(x=>{if(have.has(x.id))return;state[k].push(fix?fix({...x}):{...x});add(k,1)})};
 if(inc.has("contacts")){const dig=t=>String(t||"").replace(/\D/g,"").slice(-9);const have=new Set(state.contacts.map(c=>dig(c.tel)));(d.contacts||[]).forEach(c=>{if(have.has(dig(c.tel)))return;have.add(dig(c.tel));state.contacts.push({...c,id:uid()});add("contacts",1)})}
 if(inc.has("parts")){const key=p=>normName(p.pn)+"|"+normName(p.des);const have=new Set(state.parts.map(key));(d.parts||[]).forEach(p=>{if(have.has(key(p)))return;have.add(key(p));state.parts.push({...p,id:uid()});add("parts",1)})}
 if(inc.has("visits")){state.visits=state.visits||{};Object.entries(d.visits||{}).forEach(([wk,w])=>{const cur=state.visits[wk]=state.visits[wk]||{days:{},shifts:{}};cur.days=cur.days||{};cur.shifts={...(w.shifts||{}),...(cur.shifts||{})};
  Object.entries(w.days||{}).forEach(([day,rows])=>{const ex=cur.days[day]=cur.days[day]||[];const sig=new Set(ex.map(r=>JSON.stringify(r)));rows.forEach(r=>{if(sig.has(JSON.stringify(r)))return;ex.push(r);add("visits",1)})})})}
 if(inc.has("taskSheets")){state.tsCats=[...new Set([...(state.tsCats||[]),...(d.tsCats||[])])];byId("taskSheets",d.taskSheets,x=>({...x,rows:(x.rows||[]).map(r=>({...r,techs:chipT(r.techs||[[r.t1,r.t1n],[r.t2,r.t2n]].filter(z=>z[0]).map(([id,nom])=>({id,nom})))}))}))}
 if(inc.has("renforts"))byId("renforts",d.renforts,x=>({...x,techs:chipT(x.techs)}));
 if(inc.has("annonces"))byId("annonces",d.annonces);
 if(inc.has("releves"))byId("releves",d.releves);
 if(inc.has("formations"))byId("formations",d.formations,x=>({...x,techs:chipT(x.techs)}));
 if(inc.has("plan")){byId("convoyages",d.convoyages,x=>({...x,techs:refT(x.techs)}));byId("missions",d.missions,x=>({...x,techs:refT(x.techs)}));byId("depannages",d.depannages,x=>({...x,techs:refT(x.techs)}))}
 if(inc.has("notes"))byId("notes",d.notes);
 if(inc.has("tpl")){state.tpl={...(state.tpl||{}),...(d.tpl||{})};add("tpl",Object.keys(d.tpl||{}).length)}
 persist();render();trPending=null;const n=Object.values(added).reduce((a,b)=>a+b,0);openTransfer();toast(n?`${n} élément(s) ajouté(s)`:"Rien de nouveau : tout existait déjà.")}

/* ---------- archives par semaine ---------- */
if(!ui.arc)ui.arc={y:weekOf(todayStr()).y,only:false};
function arcWeek(y,w){const sw=ui.week,sv=ui.vweek;ui.week={y,w};ui.vweek={y,w};
 try{const ws=weekStart(y,w),a=iso(ws),b=iso(plus(ws,6));const nC=weekItems().length,nM=missionWeek().length,nD=depWeek().length;
  const vw=(state.visits||{})[`${y}-W${w}`];const nV=vw?Object.values(vw.days||{}).reduce((s,r)=>s+r.length,0):0;
  const ts=(state.taskSheets||[]).filter(x=>x.date>=a&&x.date<=b).map(tsFix).sort((p,q)=>p.date.localeCompare(q.date));const rf=(state.renforts||[]).filter(x=>x.date>=a&&x.date<=b).sort((p,q)=>p.date.localeCompare(q.date));
  const fm=(state.formations||[]).filter(x=>x.debut<=b&&(x.fin||x.debut)>=a).sort((p,q)=>p.debut.localeCompare(q.debut));const n={c:nC,m:nM,d:nD,v:nV,t:ts.length,r:rf.length,f:fm.length};const tot=nC+nM+nD+nV+ts.length+rf.length+fm.length;let text="";
  if(tot){const L=[`Archives Hangar Est — Semaine S${w} ${y}`,`Du ${ccDay(a)} au ${ccDay(b)}`];const body=s=>s.text.split("\n").slice(2).filter((l,i,arr)=>!(i===0&&!l.trim()));
   if(nC)L.push("","*CVG*",...body(shareData("convoyages","fr")));
   if(nM)L.push("","*Missions*",...body(shareData("missions","fr")));
   if(nD)L.push("","*Dépannages*",...body(shareData("depannages","fr")));
   if(nV){const v=vText().text.split("\n");L.push("","*Programme visites*",...v.slice(3,v.length-2).filter((l,i)=>!(i===0&&!l.trim())))}
   if(ts.length){L.push("","*Répartition des tâches*");ts.forEach(o=>{L.push(`- ${ccDay(o.date)} ${o.shift}${o.im&&o.im!=="CN-"?" — "+o.im:""}${o.visite?" ("+o.visite+")":""}`);tsGroups(o).forEach(([c,rs])=>rs.forEach(r=>L.push(`   ${c} : ${tsNames(r)||"à définir"}${r.obs?" — "+r.obs:""}`)))})}
   if(rf.length){L.push("","*Renforts*");rf.forEach(r=>L.push(`- ${ccDay(r.date)} (${r.lieu}) : ${r.techs.map(rfName).join(", ")}${r.obs?" — "+r.obs:""}`))}
   if(fm.length){L.push("","*Formations*");fm.forEach(f=>L.push(`- ${f.nom} : ${ccDay(f.debut)}${f.fin&&f.fin!==f.debut?" → "+ccDay(f.fin):""}${f.lieu?" ("+f.lieu+")":""} — ${(f.techs||[]).map(rfName).join(", ")||"à définir"}`))}
   text=L.join("\n")}
  return{y,w,a,b,n,tot,text,done:!!(state.arcWeeks||{})[`${y}-W${w}`]}}finally{ui.week=sw;ui.vweek=sv}}
function arcSection(){const y=ui.arc.y;const now=weekOf(todayStr());const last=y<now.y?weekOf(`${y}-12-28`).w:y===now.y?now.w:0;const weeks=[];
 for(let w=last;w>=1;w--){const d=arcWeek(y,w);if(d.tot&&(!ui.arc.only||d.done))weeks.push(d)}
 const lab={c:"CVG",m:"Mission",d:"Dépannage",v:"Programme",t:"Répartition",r:"Renfort",f:"Formation"};
 return`<section class="tplsec"><h2 class="sech">🗄️ Archives par semaine</h2>
 <div class="weekbar"><button class="wbtn" data-arcy="-1" aria-label="Année précédente">‹</button><b class="cclab">${y}</b><button class="wbtn" data-arcy="1" aria-label="Année suivante">›</button></div>
 <div class="filters"><button type="button" class="fchip" data-arconly="0" aria-pressed="${!ui.arc.only}">Toutes les semaines</button><button type="button" class="fchip" data-arconly="1" aria-pressed="${ui.arc.only}">🗄️ Archivées</button></div>
 <div class="arclist">${weeks.map(d=>`<details class="arcw"><summary><span class="arch"><b>S${d.w}</b> <small>${fmtShort(d.a)} – ${fmt(d.b)}</small>${d.done?` <span class="chip ok">🗄️ Archivée</span>`:""}</span><span class="arcn">${Object.entries(d.n).filter(([,v])=>v).map(([k,v])=>`<span class="chip">${v} ${lab[k]}</span>`).join("")}</span></summary>
  <pre class="preview">${esc(d.text)}</pre>
  <div class="share-actions"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(d.text)}" target="_blank" rel="noopener">WhatsApp</a><button type="button" class="btn" data-arc="${d.y}-${d.w}" data-act="copy">${T("sh_copy")}</button><button type="button" class="btn" data-arc="${d.y}-${d.w}" data-act="pdf">📄 PDF</button><button type="button" class="btn" data-arc="${d.y}-${d.w}" data-act="doc">📝 Word</button></div>
  <button type="button" class="btn ${d.done?"":"primary"} arcbtn" data-arc="${d.y}-${d.w}" data-act="toggle">${d.done?"↩️ Retirer des archives":"🗄️ Archiver cette semaine"}</button></details>`).join("")||`<p class="notes">${ui.arc.only?"Aucune semaine archivée pour cette année.":"Aucune donnée pour cette année."}</p>`}</div></section>`}

const fmDays=f=>nbDays(f.debut,f.fin||f.debut);
function fmOn(d){return(state.formations||[]).filter(f=>f.debut&&f.debut<=d&&(f.fin||f.debut)>=d)}

function fmMatch(f,q){if(!q)return true;q=normName(q);return normName([f.nom,f.lieu||"",f.obs||"",ccDay(f.debut),ccDay(f.fin||f.debut),...(f.techs||[]).map(rfName)].join(" ")).includes(q)}

function fmList(){return[...(state.formations||[])].filter(f=>fmMatch(f,ui.fm.q)).sort((a,b)=>b.debut.localeCompare(a.debut))}

function quotaCheck(d,sel){if(!d)return null;const wk=weekOf(d);const q=quotaOf(wk.y,wk.w);if(!q)return null;const crewSet=crewOfWeek(wk.y,wk.w,editing.id);sel.forEach(id=>crewSet.add(id));return{q,w:wk.w,crewSet,full:crewSet.size>=q,over:crewSet.size>q}}
function liveForm(){const f=$("#f");if(!f)return;const fd=new FormData(f);
 {const ts=$("#tpsum");if(ts){const nm=fd.getAll("techs").map(id=>techById(id)).filter(Boolean).map(t=>t.nom);ts.textContent=nm.length?`${T("n_techs",nm.length)} : ${nm.join(", ")}`:T("tp_choose")}}

  $("#untilBox").hidden=!fd.has("repeat");
  const w=[...warns({techs:sel},fd.get("zone")),...(d?(nd?sel.map(techById).filter(t=>t&&leaveRange(t,d,dEnd)).map(t=>{const lv=leaveRange(t,d,dEnd);return T("warn_leave",t.nom,fmtShort(lv.debut),fmt(lv.fin))}):conflicts(sel,d,d,editing.id)):[])];$("#fwarn").innerHTML=w.map(x=>`<div>${esc(x)}</div>`).join("");

  const wk=d?weekOf(d):null;
  f.querySelectorAll(".hint").forEach(h=>{const tid=h.dataset.tid;if(d&&leaveRange(techById(tid),d,dEnd)){h.className="hint busy";h.textContent="⚠ "+T("h_leave");return}const b=d&&!nd?busyOn(tid,d,editing.id):null;
   if(b){h.className="hint busy";h.textContent=T("h_busy_day");return}

function submitForm(e){e.preventDefault();const f=e.target,fd=new FormData(f),err=$("#ferr");const k=editing.kind;let o;
 const fail=m=>{err.textContent=m;err.hidden=false};
 if(k==="missions"){o={type:fd.get("type"),spontanee:fd.has("spontanee"),destination:fd.get("destination").trim(),debut:fd.get("debut"),fin:fd.get("fin"),techs:fd.getAll("techs"),notes:fd.get("notes").trim()};
  if(!o.destination)return fail(T("e_dest"));if(!o.debut||!o.fin)return fail(T("e_dates"));if(o.fin<o.debut)return fail(T("e_order"))}

  if(!o.objet)return fail(T("e_objet"));if(!o.destination)return fail(T("e_dest"));if(!o.debut||!o.fin)return fail(T("e_dates"));if(o.fin<o.debut)return fail(T("e_order"))}
 else if(k==="convoyages"){o={date:fd.get("date"),noday:fd.get("noday")==="1",nature:fd.get("nature"),zone:fd.get("zone"),destination:fd.get("destination").trim(),spontane:fd.has("spontane"),repeat:fd.has("repeat"),until:fd.has("repeat")?(fd.get("until")||""):"",techs:fd.getAll("techs"),notes:fd.get("notes").trim()};
  if(!o.date)return fail(T("e_cdate"));if(o.until&&o.until<o.date)return fail(T("e_until"));

 else if(k==="notes"){o={titre:fd.get("titre").trim(),texte:fd.get("texte").trim(),updated:todayStr()};if(!o.titre&&!o.texte)return fail(T("e_note"))}
 else{o={nom:fd.get("nom").trim().toUpperCase(),badge:fd.get("badge"),vaccin:fd.get("vaccin")==="Oui",visa:fd.get("visa")==="Oui",aprs:fd.get("aprs")==="Oui",conges:readLeaves(fd),notes:fd.get("notes").trim()};if(!o.nom)return fail(T("e_name"));if(o.conges===null)return fail(T("e_leave"))}
 if(editing.id){const i=state[k].findIndex(x=>x.id===editing.id);const prev=state[k][i];state[k][i]={...prev,...o,id:prev.id,exemple:false}}

 const wasNew=!editing.id;const lw=leaveWarn(k,o);closeForm();render();persist();toast(lw||T(wasNew?"t_added":"t_edited"),lw?5000:2200);

const MIME={pdf:"application/pdf",doc:"application/msword",txt:"text/plain",json:"application/json"};
const localDl={async save({filename,data}){const ext=filename.split(".").pop();const blob=data instanceof Blob?data:new Blob([data],{type:(MIME[ext]||"application/octet-stream")+";charset=utf-8"});
 const file=new File([blob],filename,{type:MIME[ext]||blob.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
let dlP=null;function getDl(){if(!dlP)dlP=Promise.resolve(localDl);return dlP}

async function saveFile(kind){const dl=await getDl();if(!dl)return;let data,name;
 if(kind==="txt"){data=shareCur.text;name=shareCur.file+".txt"}
 else{const s=LANG==="ar"?shareData(shareCur.kind,"fr"):shareCur;if(kind==="doc"){data=buildDoc(s);name=s.file+".doc"}else{data=buildPdf(s);name=s.file+".pdf"}}
 try{await dl.save({filename:name,data});toast(kind==="doc"?"Fichier Word prêt":T(kind==="txt"?"t_noteReady":"t_pdfReady"))}
 catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast(T("t_busyShare"));return}toast(T("t_shareFail"))}}
function buildPdf(s){const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const L=15,W=180;let y=20;
 const clean=t=>String(t).replace(/[–—]/g,"-").replace(/ | /g," ");
 doc.setFont("helvetica","bold");doc.setFontSize(15);doc.splitTextToSize(clean(s.title),W).forEach(l=>{doc.text(l,L,y);y+=7});
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text(clean(s.range),L,y);y+=9;doc.setTextColor(0);
 const cw=s.cols.length>4?[36,50,24,32,38]:[42,58,30,50];const head=()=>{doc.setFillColor(230,235,240);doc.rect(L,y-5,W,7,"F");doc.setFont("helvetica","bold");let x=L+2;s.cols.forEach((c,i)=>{doc.text(c,x,y);x+=cw[i]});y+=7;doc.setFont("helvetica","normal")};
 head();
 if(!s.rows.length)doc.text(s.none,L+2,y);
 let prev="";s.rows.forEach(r=>{if(y>280){doc.addPage();y=20;head()}let x=L+2;
  r.forEach((v,i)=>{const t=(i===0&&v===prev)?"":clean(v);doc.text(doc.splitTextToSize(t,cw[i]-3)[0]||"",x,y);x+=cw[i]});prev=r[0];
  doc.setDrawColor(220);doc.line(L,y+2,L+W,y+2);y+=7});
 return doc.output("blob")}

document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="rl-q"){ui.rl.q=t.value;$("#rlList").innerHTML=rlListHtml();return}

  res.innerHTML=m.map(x=>`<button type="button" class="tsresb" data-tspick="${x.id}"><b>${esc(x.nom)}</b> <span class="badge" data-b="${esc(x.badge)}">${esc(x.badge)}</span>${leaveRange(x,date)?" ⚠️ congé":""}</button>`).join("")||`<span class="notes">Aucun technicien trouvé.</span>`;return}
 if(t.id==="tq"){ui.tq=t.value;const pos=t.selectionStart;render();const n=$("#tq");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}if(t.id==="rf-q"){ui.rf.q=t.value;$("#rfList").innerHTML=rfListHtml();return}if(t.id==="rf-hq"){ui.rf.q=t.value;$("#rfHist").innerHTML=rfHistBody();return}if(t.id==="lp-zoom"){lpZoom(t.value);return}if(["cv-val"].includes(t.id)){cvUpdate();return}if(t.id==="mm-q"){ui.mm.esc=t.value.toUpperCase();$("#mmBody").innerHTML=mmBody();return}if(["fc-ini","fc-fin","fc-dens"].includes(t.id)){fcRefresh();return}if(t.id==="imp-txt"){pnImpPreview(t.value);return}if(t.id==="pnsearch"){ui.pn.q=t.value;pnRefresh();return}if(t.dataset&&t.dataset.pnsel){const v=Math.max(0,parseInt(t.value)||0);if(v)ui.pn.sel[t.dataset.pnsel]=v;else delete ui.pn.sel[t.dataset.pnsel];t.closest(".pnitem").classList.toggle("on",!!v);pnUpdate();return}if(t.id==="pnim"){setTimeout(pnUpdate,0);return}});

if(lt.id==="fm-deb"||lt.id==="fm-fin"){if(lt.id==="fm-deb"&&(!$("#fm-fin").value||$("#fm-fin").value<lt.value))$("#fm-fin").value=lt.value;fmDur();const d=$("#fm-deb").value;$("#fm-add").innerHTML=tsTechOpts(d);const ts=[...document.querySelectorAll("#fmChips .tschip")].map(c=>({id:c.dataset.id,nom:c.dataset.nom}));$("#fmChips").innerHTML=ts.map(t=>tsChip(t,d)).join("");return}if(lt.id==="rf-add"){const v=lt.value;lt.value="";if(v==="__other"){$("#rfOth").hidden=false;$("#rf-oth").focus();return}if(v){if([...document.querySelectorAll("#rfChips .tschip")].some(c=>c.dataset.id===v)){toast("Déjà ajouté");return}$("#rfChips").insertAdjacentHTML("beforeend",tsChip({id:v,nom:tsTechName(v)},$("#rf-date").value))}return}
